<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>מערכת ניהול תזרים מזומנים | איזון תעשיות ומתכת בע"מ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --graphite-900:#1c2024;
  --graphite-800:#262b31;
  --graphite-700:#333a42;
  --steel-500:#4b6b83;
  --steel-300:#7d9bb3;
  --steel-100:#e3ecf2;
  --brass:#c8963e;
  --bg:#eef1f3;
  --card:#ffffff;
  --line:#dde3e8;
  --ink:#1c2024;
  --muted:#697178;
  --green:#1f9d55;
  --green-bg:#e7f7ee;
  --red:#d64545;
  --red-bg:#fceaea;
  --orange:#e8a33d;
  --orange-bg:#fdf3e2;
  --blue:#2f6690;
  --blue-bg:#e8f1f8;
  --radius:14px;
  --shadow:0 1px 2px rgba(28,32,36,.06), 0 6px 16px rgba(28,32,36,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Heebo',sans-serif;
  background:
    linear-gradient(180deg, rgba(28,32,36,.03), rgba(28,32,36,0) 200px),
    repeating-linear-gradient(0deg, rgba(75,107,131,.035) 0px, rgba(75,107,131,.035) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(90deg, rgba(75,107,131,.035) 0px, rgba(75,107,131,.035) 1px, transparent 1px, transparent 24px),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,h4,.brandfont{font-family:'Rubik',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c7cfd5;border-radius:8px;}

/* ===== layout shell ===== */
#app{display:flex;min-height:100vh;}
#sidenav{
  width:230px;flex:0 0 230px;background:var(--graphite-900);
  color:#cfd6db;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-left:3px solid var(--brass);
  z-index:40;
}
#sidenav .brand{
  display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;
}
#sidenav .brand .gear{
  width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg, var(--brass), #8a6420, var(--brass));
  display:flex;align-items:center;justify-content:center;flex:0 0 34px;
  box-shadow:inset 0 0 0 3px var(--graphite-900), 0 0 0 1px rgba(255,255,255,.15);
}
#sidenav .brand .gear span{font-size:16px;}
#sidenav .brand .txt{line-height:1.25;}
#sidenav .brand .txt b{display:block;font-family:'Rubik';font-size:13.5px;color:#fff;}
#sidenav .brand .txt small{color:#9aa5ac;font-size:11px;}
.navlink{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:3px;
  cursor:pointer;font-size:14px;color:#c7ced3;transition:.15s;user-select:none;
}
.navlink .ic{width:20px;text-align:center;font-size:15px;}
.navlink:hover{background:rgba(255,255,255,.06);color:#fff;}
.navlink.active{background:var(--brass);color:#20242a;font-weight:600;}
#navToggle{display:none;}

#main{flex:1;min-width:0;padding:22px 26px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;
  background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);
  border-top:4px solid var(--brass);
}
.topbar h1{margin:0;font-size:19px;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.iconbtn{
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;
  font-size:13px;display:flex;align-items:center;gap:6px;color:var(--graphite-800);transition:.15s;
}
.iconbtn:hover{border-color:var(--steel-500);color:var(--steel-500);}
.iconbtn.mobileonly{display:none;}

.view{display:none;}
.view.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ===== cards / grids ===== */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid4{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.month-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;
  border-top:5px solid var(--steel-300);transition:.15s;position:relative;overflow:hidden;
}
.month-card:hover{transform:translateY(-2px);box-shadow:0 4px 6px rgba(28,32,36,.08),0 14px 28px rgba(28,32,36,.1);}
.month-card.pos{border-top-color:var(--green);}
.month-card.neg{border-top-color:var(--red);}
.month-card.zero{border-top-color:var(--steel-300);}
.month-card .mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.month-card .mhead .mname{font-family:'Rubik';font-weight:700;font-size:15px;}
.month-card .mhead .tag{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tag.pos{background:var(--green-bg);color:var(--green);}
.tag.neg{background:var(--red-bg);color:var(--red);}
.tag.zero{background:var(--steel-100);color:var(--steel-500);}
.gauges-row{display:flex;gap:10px;margin:10px 0;}
.balance-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px;}
.balance-row b{color:var(--ink);}
.mini-cut{display:flex;justify-content:space-between;background:var(--steel-100);border-radius:8px;padding:7px 10px;font-size:11.5px;margin-top:8px;}
.mini-cut b{font-family:'Rubik';}
.counts{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:8px;}

/* gauge (machinist dial) */
.gauge-wrap{flex:1;text-align:center;}
.gauge-label{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;}
.gauge-amount{font-family:'Rubik';font-weight:700;font-size:13px;margin-top:2px;}

/* buttons */
.btn{
  border:none;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#187f45;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#b93636;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:hover{background:#245676;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-ghost{background:#fff;color:var(--graphite-800);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--steel-500);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;}
@media(max-width:900px){.action-grid{grid-template-columns:repeat(2,1fr);}}
.action-tile{
  border-radius:var(--radius);padding:16px;color:#fff;cursor:pointer;text-align:center;font-weight:600;font-size:13.5px;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s;box-shadow:var(--shadow);
}
.action-tile:hover{transform:translateY(-2px);}
.action-tile .ic{font-size:22px;}

/* forms */
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;
  background:#fcfdfd;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel-300);border-color:var(--steel-500);}
.field{margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
.section-title{font-family:'Rubik';font-weight:700;font-size:15px;margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.section-title:first-child{border-top:none;padding-top:0;margin-top:0;}
.pill-toggle{display:flex;gap:8px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.pill.active{background:var(--steel-500);color:#fff;border-color:var(--steel-500);}

/* tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:820px;}
th{background:var(--graphite-800);color:#fff;text-align:right;padding:11px 12px;font-weight:600;font-size:12.5px;white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:nth-child(even){background:#f7f9fb;}
tbody tr:hover{background:#eef4fa;}
td.col-income{color:var(--green);font-weight:700;}
td.col-expense{color:var(--red);font-weight:700;}
th.col-income{background:#1f7a4d;}
th.col-expense{background:#b7322a;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f7f9fa;}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.status-expected{background:var(--blue-bg);color:var(--blue);}
.status-paid{background:var(--green-bg);color:var(--green);}
.status-partial{background:var(--orange-bg);color:var(--orange);}
.status-late{background:var(--red-bg);color:var(--red);}
.status-cancelled{background:#eee;color:#888;}
.status-postponed{background:#f0e8fc;color:#7a49b8;}
.rowbtns{display:flex;gap:4px;}
.iconsm{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.iconsm:hover{border-color:var(--steel-500);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.toolbar input[type=text],.toolbar select{width:auto;min-width:130px;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{padding-right:34px;}
.search-box .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);}

.months-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;}
.month-chip{
  flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;
}
.month-chip.active{background:var(--graphite-900);color:#fff;border-color:var(--graphite-900);}
.year-switch{display:flex;align-items:center;gap:10px;font-family:'Rubik';font-weight:700;font-size:15px;}
.year-switch button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;}

/* daily cashflow board */
.day-row{display:grid;grid-template-columns:110px 1fr 1fr 1fr 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center;font-size:13px;cursor:pointer;}
.day-row:hover{background:#f7f9fa;}
.day-row.neg{background:var(--red-bg);}
.day-row.warn{background:var(--orange-bg);}
.day-row .lbl{font-size:10px;color:var(--muted);display:block;}
@media(max-width:800px){.day-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto;}}

/* bar chart */
.chart-card{margin-bottom:16px;}
.chart-legend{display:flex;gap:16px;margin-bottom:10px;font-size:12.5px;}
.chart-legend span{display:flex;align-items:center;gap:6px;}
.chart-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.barchart-scroll{overflow-x:auto;padding-bottom:6px;}
.barchart-row{display:flex;align-items:flex-end;gap:18px;min-height:210px;padding:34px 6px 0;}
.barchart-col{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:60px;}
.barchart-bars{display:flex;align-items:flex-end;gap:4px;height:140px;}
.barchart-bar{width:16px;border-radius:5px 5px 0 0;position:relative;display:flex;align-items:flex-start;justify-content:center;transition:.2s;cursor:help;}
.barchart-bar .val{position:absolute;top:-22px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.barchart-date{font-size:11px;color:var(--ink);margin-top:10px;font-weight:700;white-space:nowrap;background:var(--steel-100);padding:3px 9px;border-radius:20px;}
.barchart-empty{text-align:center;padding:30px;color:var(--muted);}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;margin-bottom:10px;font-size:13.5px;}
.alert .ic{font-size:17px;}
.alert.sev-red{background:var(--red-bg);color:#8f2b2b;}
.alert.sev-orange{background:var(--orange-bg);color:#7a5518;}
.alert.sev-blue{background:var(--blue-bg);color:#1d4666;}
.alert.sev-green{background:var(--green-bg);color:#116b38;}
.alert .txt b{display:block;font-size:13.5px;}
.alert .txt span{color:inherit;opacity:.85;font-size:12.5px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,23,26,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}
.closeX{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--graphite-900);color:#fff;padding:13px 22px;
  border-radius:11px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:8px;
  animation:toastin .2s ease;
}
.toast.err{background:var(--red);}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.badge-count{background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-right:auto;}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}

@media(max-width:900px){
  #sidenav{position:fixed;right:0;top:0;transform:translateX(100%);transition:.25s;box-shadow:-6px 0 24px rgba(0,0,0,.3);}
  #sidenav.open{transform:translateX(0);}
  #main{padding:14px;}
  .iconbtn.mobileonly{display:flex;}
  table{min-width:680px;}
}
#printReportHeader{ display:none; }
.report-summary-box{ background:linear-gradient(135deg,#0e3a5f,#134a72); color:#fff; border-radius:12px; padding:16px 20px; margin-bottom:16px; }
.report-summary-box .rs-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }
.report-summary-box .rs-item .rs-label{ font-size:11.5px; opacity:.8; }
.report-summary-box .rs-item .rs-value{ font-family:Rubik; font-weight:700; font-size:18px; margin-top:2px; }
@media print{
  #sidenav, #topbarSlot, .toolbar, .no-print, #modal-root, #toast-root { display:none !important; }
  #main{ padding:0 !important; }
  body{ background:#fff !important; }
  .card{ box-shadow:none !important; border:1px solid #ddd !important; padding:0 !important; }
  #printReportHeader{ display:block !important; margin-bottom:16px; border-bottom:3px solid #134a72; padding-bottom:10px; }
  #printReportHeader .prh-company{ font-size:18px; font-weight:800; color:#0e3a5f; }
  #printReportHeader .prh-title{ font-size:15px; margin-top:4px; }
  #printReportHeader .prh-meta{ font-size:11px; color:#666; margin-top:4px; }
  .report-summary-box{ background:#eef2f7 !important; color:#0e3a5f !important; border:1px solid #ccc; }
  .table-wrap{ overflow:visible !important; border:none !important; }
  table{ font-size:11.5px !important; width:100% !important; min-width:0 !important; table-layout:auto !important; border-collapse:collapse !important; }
  th, td{ white-space:nowrap !important; overflow:hidden; text-overflow:ellipsis; padding:6px 8px !important; border:1px solid #ccc !important; }
  th{ background:#0e3a5f !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  tr{ page-break-inside:avoid; }
  tbody tr:nth-child(even){ background:#f7f9fb !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidenav"></div>
  <div id="main">
    <div id="topbarSlot"></div>
    <div id="viewsSlot"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="chartTooltip" style="display:none;position:fixed;z-index:9999;background:#1a2b3d;color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:260px;pointer-events:none;"></div>
<script>
/* =========================================================================
   מערכת ניהול תזרים מזומנים - איזון תעשיות ומתכת בע"מ
   שכבת נתונים + כלים כלליים
   ========================================================================= */
const STORAGE_KEY = 'izun_cashflow_v1';
const HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const EXPENSE_TYPES = ['שכירות','ארנונה',"צ'קים בחוץ",'כרטיסי אשראי','תשלום לספקים','הוראת קבע','שכר עובדים','מיסים','הלוואות','הוצאות רכב','אחר'];
const EXPENSE_TYPE_COLORS = {
  'שכירות':'#8B5CF6',
  'ארנונה':'#F59E0B',
  "צ'קים בחוץ":'#0EA5E9',
  'כרטיסי אשראי':'#EC4899',
  'תשלום לספקים':'#14B8A6',
  'הוראת קבע':'#6366F1',
  'שכר עובדים':'#84CC16',
  'מיסים':'#DC2626',
  'הלוואות':'#F97316',
  'הוצאות רכב':'#64748B',
  'אחר':'#9CA3AF'
};
function expenseTypeColor(type){ return EXPENSE_TYPE_COLORS[type] || '#9CA3AF'; }
function expenseTypeBadge(type){
  const c = expenseTypeColor(type);
  return `<span style="background:${c}20;color:${c};border:1px solid ${c}66;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;">${type}</span>`;
}
const PAYMENT_METHODS = ['העברה בנקאית','מזומן',"צ'ק",'כרטיס אשראי','הוראת קבע','אחר'];
const STATUSES = ['צפוי','שולם','שולם חלקית','באיחור','בוטל','נדחה'];
const STATUS_CLASS = {'צפוי':'status-expected','שולם':'status-paid','שולם חלקית':'status-partial','באיחור':'status-late','בוטל':'status-cancelled','נדחה':'status-postponed'};
const FREQ_OPTIONS = [{v:1,l:'חודשי'},{v:2,l:'דו חודשי'},{v:3,l:'רבעוני'},{v:6,l:'חצי שנתי'},{v:12,l:'שנתי'}];

function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- cloud sync (Supabase) ---------- */
const SUPABASE_URL = 'https://qwpgxoxgxuyvjfrfshea.supabase.co';

// Global safety net: catch ANY uncaught error or rejected promise anywhere on the
// page (not just inside view rendering) and show a visible banner instead of a
// silent blank/broken screen - critical for diagnosing device-specific issues.
window.addEventListener('error', function(e){
  console.error('Global error:', e.error || e.message);
  showGlobalErrorBanner(e.error || e.message);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
  showGlobalErrorBanner(e.reason);
});
function showGlobalErrorBanner(err){
  if(document.getElementById('globalErrorBanner')) return; // don't stack multiple banners
  const banner = document.createElement('div');
  banner.id = 'globalErrorBanner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b7322a;color:#fff;padding:12px 16px;z-index:99999;font-size:13px;text-align:center;direction:rtl;box-shadow:0 2px 8px rgba(0,0,0,.3);';

  banner.innerHTML = `⚠️ אירעה שגיאה: ${msg} <button onclick="location.reload()" style="margin-right:10px;background:#fff;color:#b7322a;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:700;">🔄 רענון הדף</button> <button onclick="this.parentElement.remove()" style="margin-right:6px;background:transparent;color:#fff;border:1px solid #fff;border-radius:6px;padding:5px 10px;cursor:pointer;">✕</button>`;
  document.body.appendChild(banner);
}

let DB = null;

async function loadDB(){
  let loadedFromCloud = false;
  try{
    if(supabaseClient){
      const { data, error } = await supabaseClient.from('app_state').select('data,updated_at').eq('id','main').maybeSingle();
      if(!error && data && data.data){
        DB = data.data;
        loadedFromCloud = true;
        cloudStatus = 'online';
      } else if(!error && !data){
        // no cloud row yet - this is the very first run for this project
        cloudStatus = 'online';
      } else {
        cloudStatus = 'offline';
      }
    } else {
      cloudStatus = 'offline';
    }
  }catch(e){
    console.error('cloud load error', e);
    cloudStatus = 'offline';
  }

  if(!loadedFromCloud){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ DB = JSON.parse(raw); }
      else{ DB = defaultData(); }
    }catch(e){
      console.error('local load error', e);
      DB = defaultData();
    }
  }

  // migration safety - ensure new fields exist
  const d = defaultData();
  Object.keys(d).forEach(k=>{ if(!(k in DB)) DB[k]=d[k]; });
  // one-time spelling fix: the surname is איזון, not עזון (matches the company name)
  if(DB.currentUser === 'ברוך עזון') DB.currentUser = 'ברוך איזון';
  if(Array.isArray(DB.users)){
    DB.users.forEach(u=>{ if(u.name === 'ברוך עזון') u.name = 'ברוך איזון'; });
  }

  window.DB = DB; // exposed for console debugging
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){} // keep local cache fresh too
  return DB;
}

function saveDB(){
  // 1) always save locally first - instant, synchronous, never blocked by network
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    console.error('local save error', e);
    showToast('שגיאה בשמירת הנתונים באופן מקומי', true);
    return false;
  }
  // 2) push to the cloud in the background so other computers can see the change too
  if(supabaseClient){
    supabaseClient.from('app_state').upsert({
      id: 'main', data: DB, updated_at: nowISO(), updated_by: DB.currentUser
    }).then(({error})=>{
      if(error){
        cloudStatus = 'offline';
        console.error('cloud save error', error);
      } else {
        cloudStatus = 'online';
      }
      updateCloudStatusUI();
    }).catch(e=>{
      cloudStatus = 'offline';
      console.error('cloud save exception', e);
      updateCloudStatusUI();
    });
  }
  return true;
}

/* ---------- date helpers ---------- */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowISO(){ return new Date().toISOString(); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function toISO(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function addMonths(iso, n){ const d=parseISO(iso); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return toISO(d); }
function fmtDateHe(iso){ if(!iso) return '-'; const d=parseISO(iso); return `${String(d.getDate()).padStart(2,'0')} ב${HE_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(iso){ if(!iso) return '-'; const d=parseISO(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
function monthKeyOf(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return `${HE_MONTHS[m-1]} ${y}`; }
function todayMonthKey(){ return monthKey(todayISO()); }
function creditCardDefaultDate(txnDateISO){
  // 15th of the month AFTER the transaction month
  const d = parseISO(txnDateISO);
  const targetMonth = new Date(d.getFullYear(), d.getMonth()+1, 15);
  return toISO(targetMonth);
}
function monthsAhead(n, startIso){
  // pure integer year/month arithmetic - deliberately avoids any string round-trip so it can never collapse to a single repeated month
  const base = startIso ? parseISO(startIso) : new Date();
  const y = base.getFullYear(), m = base.getMonth();
  const arr = [];
  for(let i=0;i<n;i++){
    const total = m+i;
    const yy = y + Math.floor(total/12);
    const mm = ((total%12)+12)%12;
    arr.push(yy+'-'+String(mm+1).padStart(2,'0'));
  }
  return arr;
}

/* ---------- currency ---------- */
function fmtILS(n){
  n = Number(n)||0;
  const neg = n<0; n=Math.abs(n);
  const s = n.toLocaleString('he-IL',{minimumFractionDigits:0,maximumFractionDigits:2});
  return (neg?'-':'')+s+' ש"ח';
}
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

/* ---------- live-formatted money inputs (comma separators + ש"ח suffix while typing) ---------- */
function parseMoneyString(str){
  if(str===undefined||str===null) return 0;
  const cleaned = String(str).replace(/[^\d.\-]/g,'');
  return Number(cleaned)||0;
}
function formatMoneyInputEl(el){
  const caretAtEnd = true; // simple, predictable behavior for a right-to-left currency field
  // keep a leading minus (for credit invoices), digits, and a single decimal point (agorot)
  const isNeg = /^\s*-/.test(el.value);
  let raw = el.value.replace(/[^\d.]/g,'');
  const firstDot = raw.indexOf('.');
  if(firstDot !== -1){
    // collapse any extra dots the user typed, and cap at 2 decimal digits
    raw = raw.slice(0, firstDot+1) + raw.slice(firstDot+1).replace(/\./g,'').slice(0,2);
  }
  raw = raw.replace(/^0+(?=\d)/,'');
  if(raw===''||raw==='.'){ el.value = isNeg ? '-' : ''; return; }
  const dotIdx = raw.indexOf('.');
  const intPart = dotIdx===-1 ? raw : raw.slice(0,dotIdx);
  const decPart = dotIdx===-1 ? '' : raw.slice(dotIdx); // includes the dot itself, e.g. ".5"
  const intNum = Number(intPart)||0;
  el.value = (isNeg?'-':'') + intNum.toLocaleString('he-IL') + decPart + ' ש"ח';
  if(caretAtEnd) el.setSelectionRange && el.setSelectionRange(el.value.length-4, el.value.length-4);
}
function moneyInputAttrs(){
  return `type="text" inputmode="numeric" class="money-input" oninput="formatMoneyInputEl(this)"`;
}
function fmtMoneyInputValue(n){
  n = Number(n)||0;
  if(!n) return '';
  return n.toLocaleString('he-IL') + ' ש&quot;ח';
}

function buildEqualSplit(totalAmount, numPayments, firstDate, frequencyMonths){
  frequencyMonths = frequencyMonths || 1;
  const per = Math.trunc((totalAmount/numPayments)*100)/100;
  let sum = 0;
  const rows = [];
  for(let i=0;i<numPayments;i++){
    let amt = per;
    if(i === numPayments-1){ amt = round2(totalAmount - sum); }
    else { sum = round2(sum+per); }
    rows.push({
      paymentNumber: i+1,
      date: addMonths(firstDate, i*frequencyMonths),
      amount: amt,
      status: 'צפוי',
      paidAmount: 0
    });
  }
  return rows;
}

function buildManualSplit(rows){
  // rows: [{date, amount}] provided by user; just normalize
  return rows.map((r,i)=>({ paymentNumber:i+1, date:r.date, amount: round2(Number(r.amount)||0), status:'צפוי', paidAmount:0 }));
}

/* ---------- recurring expense future generation ---------- */
function generateRecurringPayments(baseAmount, startDate, frequencyMonths, endDate, monthsHorizon){
  // generates payment rows from startDate forward, monthly*frequency, until endDate or horizon
  const rows = [];
  let cursor = startDate;
  let i=0;
  const horizonDate = addMonths(todayISO(), monthsHorizon||24);
  while(true){
    if(endDate && cursor > endDate) break;
    if(cursor > horizonDate) break;
    rows.push({ paymentNumber:i+1, date: cursor, amount: baseAmount, status:'צפוי', paidAmount:0 });
    i++;
    cursor = addMonths(startDate, i*frequencyMonths);
    if(i>500) break; // safety
  }
  return rows;
}

const DEFAULT_CC_AMOUNT = 6000;
function ensureDefaultCreditCardExpense(){
  let ex = DB.expenses.find(e=> e.extra && e.extra.isDefaultCreditCard);
  const horizonMonths = 6;
  if(!ex){
    const firstDate = creditCardDefaultDate(todayISO());
    const payments = generateRecurringPayments(DEFAULT_CC_AMOUNT, firstDate, 1, null, horizonMonths).map(p=>({...p, id:uid('epay')}));
    ex = {
      id: uid('exp'), type:'כרטיסי אשראי', supplier:'הוצאת אשראי - ברירת מחדל חודשית',
      description:'הוצאת כרטיס אשראי שנוצרה אוטומטית מדי חודש (ניתן לעריכה)', totalAmount: DEFAULT_CC_AMOUNT,
      numPayments: payments.length, frequency:1, paymentMethod:'כרטיס אשראי', reference:'', notes:'',
      isRecurring:true, endDate:null, extra:{isDefaultCreditCard:true, ccCompany:'ברירת מחדל', ccLast4:''},
      payments, createdBy: DB.currentUser, createdAt: nowISO(), updatedAt: nowISO()
    };
    DB.expenses.push(ex);
    logAudit('expense', ex.id, 'auto-create', null, null, 'default-credit-card');
    saveDB();
  } else {
    const lastDate = ex.payments.length? ex.payments.map(p=>p.date).sort().slice(-1)[0] : creditCardDefaultDate(todayISO());
    const needThrough = addMonths(todayISO(), horizonMonths);
    if(lastDate < needThrough){
      let cursor = addMonths(lastDate, 1);
      let n = ex.payments.length;
      while(cursor <= needThrough){
        ex.payments.push({ id: uid('epay'), paymentNumber: ++n, date: cursor, amount: DEFAULT_CC_AMOUNT, status:'צפוי', paidAmount:0 });
        cursor = addMonths(cursor, 1);
      }
      ex.numPayments = ex.payments.length;
      ex.updatedAt = nowISO();
      saveDB();
    }
  }
}

function allIncomePayments(){

  DB.incomeInvoices.forEach(inv=>{
    inv.payments.forEach(p=> out.push({...p, invoiceId:inv.id, customer:inv.customer, invoiceNumber:inv.invoiceNumber, notes:inv.notes, isCredit:!!inv.isCredit}));
  });
  return out;
}
function allExpensePayments(){
  const out=[];
  DB.expenses.forEach(ex=>{
    ex.payments.forEach(p=> out.push({...p, expenseId:ex.id, type:ex.type, supplier:ex.supplier, description:ex.description, paymentMethod:ex.paymentMethod, reference:ex.reference}));
  });
  return out;
}
function groupExpensesByType(items){
  const byType = {};
  items.forEach(p=>{ byType[p.type] = (byType[p.type]||0) + p.amount; });
  return Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,amount])=>({type, amount}));
}

function getOpeningBalance(){
  if(!DB.openingBalances.length) return {amount:0,date:todayISO()};
  return DB.openingBalances[DB.openingBalances.length-1];
}
function getMonthlyBankBalanceOverride(monthKeyStr){
  const list = (DB.monthlyBankBalances||[]).filter(o=>o.month===monthKeyStr);
  return list.length ? list[list.length-1] : null;
}
// finds the most relevant known starting balance at or before a given month -
// prefers a manual monthly bank-balance override (a real bank statement figure)
// over the single global opening balance, since it's more accurate/recent
function findBalanceAnchor(monthKeyStr){
  const overrides = (DB.monthlyBankBalances||[]).filter(o=>o.month<=monthKeyStr).sort((a,b)=> a.month<b.month?1:(a.month>b.month?-1:0));
  if(overrides.length) return {month:overrides[0].month, amount:Number(overrides[0].amount)||0, isOverride:true};
  const ob = getOpeningBalance();
  return {month:monthKey(ob.date), amount:Number(ob.amount)||0, isOverride:false};
}

/* ---------- monthly aggregation ---------- */
function monthStats(monthKeyStr, mode){
  // mode: 'expected' (default) uses all payments by date; 'actual' uses only paid/partial with paidAmount
  mode = mode || 'expected';
  const inc = allIncomePayments().filter(p=> monthKey(p.date)===monthKeyStr && p.status!=='בוטל');
  const exp = allExpensePayments().filter(p=> monthKey(p.date)===monthKeyStr && p.status!=='בוטל');

  function sumFor(list, mode){
    if(mode==='actual'){
      return list.reduce((s,p)=> s + (p.status==='שולם' ? p.amount : (p.status==='שולם חלקית' ? (p.paidAmount||0) : 0)), 0);
    }
    return list.reduce((s,p)=> s+p.amount, 0);
  }
  const incomeTotal = sumFor(inc, mode);
  const expenseTotal = sumFor(exp, mode);

  const inc15 = inc.filter(p=> parseISO(p.date).getDate() <= 15);
  const exp15 = exp.filter(p=> parseISO(p.date).getDate() <= 15);
  const income15 = sumFor(inc15, mode);
  const expense15 = sumFor(exp15, mode);

  const lateIncome = inc.filter(p=>p.status==='באיחור').length;
  const lateExpense = exp.filter(p=>p.status==='באיחור').length;

  return {
    monthKeyStr, incomeTotal, expenseTotal, balance: round2(incomeTotal-expenseTotal),
    income15, expense15, balance15: round2(income15-expense15),
    countIncome: inc.length, countExpense: exp.length,
    lateIncome, lateExpense,
    incomePayments: inc, expensePayments: exp
  };
}

// cumulative balance up to & including a given month key, from the nearest known
// anchor forward (either a manual monthly bank-balance override, or the global
// opening balance if no override applies yet)
function cumulativeBalanceThroughMonth(monthKeyStr, mode){
  const anchor = findBalanceAnchor(monthKeyStr);
  let bal = anchor.amount;
  let cursor = anchor.month;
  const seen = new Set();
  while(true){
    if(cursor === monthKeyStr){ bal += monthStats(cursor, mode).balance; break; }
    const stats = monthStats(cursor, mode);
    bal += stats.balance;
    seen.add(cursor);
    cursor = addMonths(cursor+'-01',1).slice(0,7);
    if(seen.size>600) break;
  }
  return round2(bal);
}

/* ---------- daily cashflow for a specific month ---------- */
function dailyCashflow(monthKeyStr, mode){
  mode = mode||'expected';
  const [y,m] = monthKeyStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const bankOverride = getMonthlyBankBalanceOverride(monthKeyStr);
  const prevCumulative = bankOverride ? Number(bankOverride.amount)||0 : cumulativeBalanceThroughMonth(addMonths(monthKeyStr+'-01',-1).slice(0,7), mode);
  let running = prevCumulative;
  const inc = allIncomePayments().filter(p=> monthKey(p.date)===monthKeyStr && p.status!=='בוטל');
  const exp = allExpensePayments().filter(p=> monthKey(p.date)===monthKeyStr && p.status!=='בוטל');
  const days = [];
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dIncome = inc.filter(p=>p.date===iso);
    const dExpense = exp.filter(p=>p.date===iso);
    const incSum = mode==='actual'? dIncome.reduce((s,p)=>s+(p.status==='שולם'?p.amount:(p.paidAmount||0)),0) : dIncome.reduce((s,p)=>s+p.amount,0);
    const expSum = mode==='actual'? dExpense.reduce((s,p)=>s+(p.status==='שולם'?p.amount:(p.paidAmount||0)),0) : dExpense.reduce((s,p)=>s+p.amount,0);
    const openBal = running;
    const net = round2(incSum-expSum);
    running = round2(running+net);
    days.push({ day, iso, openBal, incSum, expSum, net, closeBal: running, incomeItems:dIncome, expenseItems:dExpense });
  }
  days.hasBankOverride = !!bankOverride;
  days.bankOverrideAmount = bankOverride ? Number(bankOverride.amount)||0 : null;
  days.bankOverrideNotes = bankOverride ? (bankOverride.notes||'') : '';
  return days;
}

/* ---------- alerts ---------- */
function computeAlerts(){
  const alerts = [];
  const today = todayISO();
  const in7 = addMonths(today,0); // placeholder
  const sevenDaysOut = (()=>{ const d=parseISO(today); d.setDate(d.getDate()+7); return toISO(d); })();

  // overdue income
  const incPays = allIncomePayments();
  const overdueInc = incPays.filter(p=> p.date < today && !['שולם','בוטל'].includes(p.status));
  if(overdueInc.length) alerts.push({sev:'red', ic:'⛔', title:`${overdueInc.length} חשבוניות שמועד התשלום שלהן עבר`, sub:`סה"כ ${fmtILS(overdueInc.reduce((s,p)=>s+p.amount,0))}`, key:'overdue-income'});

  // upcoming expenses (next 7 days)
  const expPays = allExpensePayments();
  const upcomingExp = expPays.filter(p=> p.date>=today && p.date<=sevenDaysOut && !['שולם','בוטל'].includes(p.status));
  if(upcomingExp.length) alerts.push({sev:'orange', ic:'⏰', title:`${upcomingExp.length} הוצאות שמועד הפירעון שלהן מתקרב (7 ימים)`, sub:`סה"כ ${fmtILS(upcomingExp.reduce((s,p)=>s+p.amount,0))}`, key:'upcoming-expense'});

  // checks due in 7 days
  const checkExpenseIds = new Set(DB.expenses.filter(e=>e.type==="צ'קים בחוץ").map(e=>e.id));
  const upcomingChecks = expPays.filter(p=> checkExpenseIds.has(p.expenseId) && p.date>=today && p.date<=sevenDaysOut && p.status!=='בוטל');
  if(upcomingChecks.length) alerts.push({sev:'orange', ic:'🧾', title:`${upcomingChecks.length} צ'קים לפירעון בשבעת הימים הקרובים`, sub:`סה"כ ${fmtILS(upcomingChecks.reduce((s,p)=>s+p.amount,0))}`, key:'upcoming-checks'});

  // credit card charges upcoming
  const creditExpenseIds = new Set(DB.expenses.filter(e=>e.type==='כרטיסי אשראי').map(e=>e.id));
  const upcomingCredit = expPays.filter(p=> creditExpenseIds.has(p.expenseId) && p.date>=today && p.date<=sevenDaysOut && p.status!=='בוטל');
  if(upcomingCredit.length) alerts.push({sev:'blue', ic:'💳', title:`${upcomingCredit.length} חיובי אשראי צפויים בקרוב`, sub:`סה"כ ${fmtILS(upcomingCredit.reduce((s,p)=>s+p.amount,0))}`, key:'upcoming-credit'});

  // loss months in next 4 months forecast
  monthsAhead(4).forEach(mk=>{
    const st = monthStats(mk,'expected');
    if(st.balance<0) alerts.push({sev:'red', ic:'📉', title:`חודש הפסד צפוי: ${monthLabel(mk)}`, sub:`יתרה חודשית ${fmtILS(st.balance)}`, key:'loss-'+mk});
    if(st.balance15<0) alerts.push({sev:'orange', ic:'📆', title:`יתרה שלילית עד ה-15 בחודש ${monthLabel(mk)}`, sub:`יתרה עד ה-15: ${fmtILS(st.balance15)}`, key:'neg15-'+mk});
    const cum = cumulativeBalanceThroughMonth(mk,'expected');
    if(cum < Number(DB.warningThreshold||0)) alerts.push({sev:'orange', ic:'📊', title:`יתרה צפויה בסוף ${monthLabel(mk)} מתחת לרף האזהרה`, sub:`יתרה מצטברת: ${fmtILS(cum)} (רף: ${fmtILS(DB.warningThreshold)})`, key:'threshold-'+mk});
  });

  // unpaid invoices overall
  const unpaidInvoices = DB.incomeInvoices.filter(inv=> inv.payments.some(p=>p.status!=='שולם' && p.status!=='בוטל'));
  if(unpaidInvoices.length) alerts.push({sev:'blue', ic:'📄', title:`${unpaidInvoices.length} חשבוניות עם יתרה שטרם שולמה`, sub:'לצפייה בדוח לקוחות שטרם שילמו', key:'unpaid-invoices'});

  return alerts.filter(a=> !DB.dismissedAlerts.includes(a.key));
}

/* ---------- gauge (machinist dial) ---------- */
function gaugeSVG(amount, refMax, color, label){
  refMax = Math.max(refMax, 1);
  const ratio = Math.max(0, Math.min(1, amount/refMax));
  const angle = -90 + ratio*180; // -90..90
  const rad = angle*Math.PI/180;
  const cx=60, cy=58, r=44;
  const nx = cx + r*0.78*Math.sin(rad);
  const ny = cy - r*0.78*Math.cos(rad);
  // ticks
  let ticks='';
  for(let i=0;i<=8;i++){
    const a = -90 + (i/8)*180;
    const ar = a*Math.PI/180;
    const x1 = cx + r*0.86*Math.sin(ar), y1 = cy - r*0.86*Math.cos(ar);
    const x2 = cx + r*0.98*Math.sin(ar), y2 = cy - r*0.98*Math.cos(ar);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#cfd6db" stroke-width="2"/>`;
  }
  const arcId = 'arc'+Math.random().toString(36).slice(2,8);
  return `
  <svg viewBox="0 0 120 78" width="100%" height="72">
    <path d="M 16 58 A 44 44 0 0 1 104 58" fill="none" stroke="#e6eaed" stroke-width="9" stroke-linecap="round"/>
    <path d="M 16 58 A 44 44 0 0 1 104 58" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${ratio*138.2} 999"/>
    ${ticks}
    <circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="2" fill="#fff"/>
  </svg>`;
}
function renderGaugeBlock(label, amount, refMax, color){
  return `
    <div class="gauge-wrap">
      ${gaugeSVG(amount, refMax, color, label)}
      <div class="gauge-label">${label}</div>
      <div class="gauge-amount" style="color:${color}">${fmtILS(amount)}</div>
    </div>`;
}

/* ---------- combined dual-needle gauge: one dial, income + expense needles, profit/loss background ---------- */
const GAUGE_INCOME_NEEDLE = '#0f6b34';
const GAUGE_EXPENSE_NEEDLE = '#9b2c2c';
function combinedGaugeSVG(income, expense, refMax){
  refMax = Math.max(refMax, 1);
  const profit = income >= expense;
  const bgFill = profit ? 'var(--green-bg)' : 'var(--red-bg)';
  const ringColor = profit ? 'var(--green)' : 'var(--red)';
  const cx=60, cy=60, r=44;
  function needleEnd(val){
    const ratio = Math.max(0, Math.min(1, val/refMax));
    const angle = -90 + ratio*180;
    const rad = angle*Math.PI/180;
    return { x: cx + r*0.76*Math.sin(rad), y: cy - r*0.76*Math.cos(rad) };
  }
  const incPt = needleEnd(income);
  const expPt = needleEnd(expense);
  let ticks='';
  for(let i=0;i<=8;i++){
    const a = -90 + (i/8)*180;
    const ar = a*Math.PI/180;
    const x1 = cx + r*0.87*Math.sin(ar), y1 = cy - r*0.87*Math.cos(ar);
    const x2 = cx + r*0.99*Math.sin(ar), y2 = cy - r*0.99*Math.cos(ar);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${profit?'#ffffffb0':'#ffffffb0'}" stroke-width="2"/>`;
  }
  return `
  <svg viewBox="0 0 120 80" width="100%" height="88">
    <path d="M 16 60 A 44 44 0 0 1 104 60 L 104 60 Z" fill="${bgFill}"/>
    <path d="M 16 60 A 44 44 0 0 1 104 60" fill="none" stroke="${ringColor}" stroke-width="4" stroke-linecap="round"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${expPt.x}" y2="${expPt.y}" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${expPt.x}" y2="${expPt.y}" stroke="${GAUGE_EXPENSE_NEEDLE}" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${incPt.x}" y2="${incPt.y}" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${incPt.x}" y2="${incPt.y}" stroke="${GAUGE_INCOME_NEEDLE}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5.5" fill="#ffffff" stroke="${ringColor}" stroke-width="2"/>
  </svg>`;
}
function renderCombinedGaugeBlock(income, expense, refMax){
  return `
    <div style="text-align:center;">
      ${combinedGaugeSVG(income, expense, refMax)}
      <div style="display:flex;justify-content:center;gap:14px;margin-top:2px;font-size:11px;flex-wrap:wrap;">
        <span style="display:flex;align-items:center;gap:4px;"><i style="width:9px;height:9px;background:${GAUGE_INCOME_NEEDLE};border-radius:50%;display:inline-block;"></i>הכנסות: <b style="color:${GAUGE_INCOME_NEEDLE}">${fmtILS(income)}</b></span>
        <span style="display:flex;align-items:center;gap:4px;"><i style="width:9px;height:9px;background:${GAUGE_EXPENSE_NEEDLE};border-radius:50%;display:inline-block;"></i>הוצאות: <b style="color:${GAUGE_EXPENSE_NEEDLE}">${fmtILS(expense)}</b></span>
      </div>
    </div>`;
}

/* ---------- colorful bar chart (only dates that actually have a movement) ---------- */
function showChartTooltip(el){
  const tt = document.getElementById('chartTooltip');
  if(!tt) return;
  tt.innerHTML = el.getAttribute('data-tt') || '';
  tt.style.display = 'block';
  const rect = el.getBoundingClientRect();
  const ttW = tt.offsetWidth || 220, ttH = tt.offsetHeight || 40;
  let left = rect.left + rect.width/2 - ttW/2;
  left = Math.max(8, Math.min(window.innerWidth - ttW - 8, left));
  let top = rect.top - ttH - 10;
  if(top < 8) top = rect.bottom + 10; // flip below the bar if there's no room above
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}
function hideChartTooltip(){
  const tt = document.getElementById('chartTooltip');
  if(tt) tt.style.display = 'none';
}
// on touch devices there's no "mouseleave" - tapping anywhere else should dismiss the tooltip
document.addEventListener('click', function(e){
  if(!e.target.closest('.barchart-bar')) hideChartTooltip();
});

function renderBarChart(entries, seriesDefs, opts){
  opts = opts||{};
  if(!entries.length){
    return `<div class="barchart-empty">אין תנועות להצגה בטווח שנבחר</div>`;
  }
  const maxVal = Math.max(1, ...entries.map(e=> seriesDefs.map(s=> Math.abs(e[s.key]||0))).reduce((a,b)=>a.concat(b),[]));
  const legend = `<div class="chart-legend">${seriesDefs.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}${entries.some(e=>(e.incomeDetail||[]).some(d=>String(d.label).includes('🟣')))?'<span><i style="background:#8b5cf6"></i>🟣 כולל חשבונית זיכוי (קו סגול בראש העמודה)</span>':''}</div>`;
  const escHtml = (s)=> String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escAttr = (s)=> String(s).replace(/"/g,'&quot;');
  const cols = entries.map(e=>{
    const bars = seriesDefs.map(s=>{
      const v = e[s.key]||0;
      if(!v) return '';
      const h = Math.max(6, Math.round((Math.abs(v)/maxVal)*140));
      const detailArr = e[s.key+'Detail'];
      // detect credit invoices from the existing detail labels (already marked with 🟣) so
      // the bar itself shows a clear, always-visible indicator - not just on hover
      const hasCredit = s.key==='income' && detailArr && detailArr.some(d=> String(d.label).includes('🟣'));
      // Custom tooltip (not the native title="" attribute) - native tooltips are slow to
      // appear, easy to miss, and don't work at all on touch/mobile devices. This shows
      // on hover (desktop) and on tap (mobile), with the credit line properly colored.
      let tooltipHtml;
      if(detailArr && detailArr.length){
        tooltipHtml = `<b>${escHtml(s.name)} - ${escHtml(e.label)}</b>` + detailArr.map(d=>{
          const isCredit = String(d.label).includes('🟣');
          return `<div style="${isCredit?'color:#c9a6ff;font-weight:600;':''}margin-top:3px;">${escHtml(d.label)}: ${escHtml(fmtILS(d.amount))}</div>`;
        }).join('');
      } else {
        tooltipHtml = `<b>${escHtml(s.name)} - ${escHtml(e.label)}</b><div style="margin-top:3px;">${escHtml(fmtILS(v))}</div>`;
      }
      const ttAttr = escAttr(tooltipHtml);
      const creditBorder = hasCredit ? 'border-top:4px solid #8b5cf6;box-sizing:border-box;' : '';
      const valPrefix = hasCredit ? '🟣 ' : '';
      const hoverAttrs = `data-tt="${ttAttr}" onmouseenter="showChartTooltip(this)" onmouseleave="hideChartTooltip()" onclick="showChartTooltip(this)"`;
      const stackArr = e[s.key+'Stack'];
      if(stackArr && stackArr.length){
        const segs = stackArr.map(seg=>{
          const segH = Math.max(1, Math.round((seg.amount/v)*h));
          return `<div style="height:${segH}px;background:${expenseTypeColor(seg.type)};width:100%;"></div>`;
        }).join('');
        return `<div class="barchart-bar" style="height:${h}px;background:transparent;overflow:hidden;display:flex;flex-direction:column-reverse;${creditBorder}" ${hoverAttrs}>${segs}<span class="val" style="color:${s.color}">${valPrefix}${fmtILS(v)}</span></div>`;
      }
      return `<div class="barchart-bar" style="height:${h}px;background:${s.color};${creditBorder}" ${hoverAttrs}><span class="val" style="color:${s.color}">${valPrefix}${fmtILS(v)}</span></div>`;
    }).join('');
    return `<div class="barchart-col"><div class="barchart-bars">${bars}</div><div class="barchart-date">${e.label||'-'}</div></div>`;
  }).join('');
  const hasStack = entries.some(e=> seriesDefs.some(s=> e[s.key+'Stack'] && e[s.key+'Stack'].length));
  const stackNote = hasStack ? `<p style="font-size:11px;color:var(--muted);margin:8px 2px 0;">🎨 צבעי ההוצאות בעמודות תואמים לסוג ההוצאה (ראו את הצבעים בטבלת ההוצאות)</p>` : '';
  return `${legend}<div class="barchart-scroll"><div class="barchart-row">${cols}</div></div>${stackNote}`;
}

let incomeInvoiceType = 'regular'; // 'regular' (default) or 'credit' (חשבונית זיכוי - negative amount)

let currentSplitType = 'manual';
function setSplitType(type){
  currentSplitType = type;
  document.querySelectorAll('.pill[data-split]').forEach(p=> p.classList.toggle('active', p.dataset.split===type));
  buildIncomePreview();
}

function setIncomeAmountMode(mode){
  incomeAmountMode = mode;
  document.querySelectorAll('.pill[data-iamode]').forEach(p=> p.classList.toggle('active', p.dataset.iamode===mode));
  const splitWrap = document.getElementById('incomeSplitTypeWrap');
  if(splitWrap) splitWrap.style.display = mode==='perPayment' ? 'none' : 'block';
  const label = document.getElementById('f_totalAmountLabel');
  if(label) label.textContent = mode==='perPayment' ? 'סכום קבוע לכל תשלום / צ\'ק (ש"ח) *' : 'סכום החשבונית כולל מע"מ (ש"ח) *';
  incomeDraftPayments = null;
  buildIncomePreview();
}

function setIncomeInvoiceType(type){
  incomeInvoiceType = type;
  document.querySelectorAll('.pill[data-itype]').forEach(p=> p.classList.toggle('active', p.dataset.itype===type));
  const hint = document.getElementById('creditHint');
  if(hint) hint.style.display = type==='credit' ? 'block' : 'none';
  incomeDraftPayments = null;
}

function onIncomeAmountOrDateChange(){
  // Critical safety net: if the user edits the top-level date/count/amount fields on an
  // already-loaded invoice (e.g. correcting a due date) without re-clicking "חשב תצוגה מקדימה",
  // the change must still take effect on save - it must never be silently discarded.
  const num = Math.max(1, parseInt(document.getElementById('f_numPayments').value)||1);
  if(incomeDraftPayments && incomeDraftPayments.length===1 && num===1){
    // single payment - no ambiguity, sync the date directly onto the actual draft payment
    const newDate = document.getElementById('f_firstDate').value;
    if(newDate) incomeDraftPayments[0].date = newDate;
  } else {
    // payment count changed, or draft not yet built - force a full, fresh rebuild
    incomeDraftPayments = null;
  }
  buildIncomePreview();
}

function buildIncomePreview(forceType, existingPayments){
  const enteredAmount = parseMoneyString(document.getElementById('f_totalAmount').value);
  const num = Math.max(1, parseInt(document.getElementById('f_numPayments').value)||1);
  const firstDate = document.getElementById('f_firstDate').value || todayISO();
  const type = forceType || currentSplitType;
  const wrap = document.getElementById('incomePreviewWrap');

  if(enteredAmount===0){ showToast('יש להזין סכום חשבונית תקין', true); return; }
  if(incomeInvoiceType==='credit' && enteredAmount>0){ showToast('חשבונית זיכוי - יש להזין את הסכום כמספר שלילי', true); return; }
  if(incomeInvoiceType!=='credit' && enteredAmount<0){ showToast('סכום חשבונית רגילה חייב להיות חיובי', true); return; }

  const total = incomeAmountMode==='perPayment' ? round2(enteredAmount*num) : enteredAmount;

  if(existingPayments){
    incomeDraftPayments = existingPayments.map(p=>({...p}));
  } else if(incomeAmountMode==='perPayment'){
    incomeDraftPayments = Array.from({length:num},(_,i)=>({
      paymentNumber:i+1, date: addMonths(firstDate, i), amount: enteredAmount, status:'צפוי', paidAmount:0
    }));
  } else if(type==='equal'){
    incomeDraftPayments = buildEqualSplit(total, num, firstDate, 1);
  } else {
    // manual: start from equal then let user edit each row directly
    if(!incomeDraftPayments || incomeDraftPayments.length!==num){
      incomeDraftPayments = buildEqualSplit(total, num, firstDate, 1);
    }
  }

  const canEditRows = incomeAmountMode!=='perPayment' && type==='manual';
  wrap.innerHTML = `
    <div class="section-title" style="margin-top:0;">👁 תצוגה מקדימה של פריסת התשלומים</div>
    ${incomeAmountMode==='perPayment'?`<p style="font-size:12.5px;color:var(--blue);">כל תשלום/צ'ק יהיה בסך ${fmtILS(enteredAmount)} - סה"כ ${num} תשלומים = ${fmtILS(total)}.</p>`:''}
    <div class="table-wrap">
      <table><thead><tr><th>#</th><th>מועד תשלום</th><th>סכום</th><th>סטטוס</th></tr></thead>
      <tbody id="incomePreviewBody">
      ${incomeDraftPayments.map((p,i)=>`
        <tr>
          <td>${p.paymentNumber}</td>
          <td>${canEditRows?`<input type="date" style="min-width:140px" value="${p.date}" onchange="updateDraftPayment(${i},'date',this.value)">`:fmtDateHe(p.date)}</td>
          <td>${canEditRows?`<input ${moneyInputAttrs()} style="min-width:110px" value="${fmtMoneyInputValue(p.amount)}" onchange="updateDraftPayment(${i},'amount',this.value)">`:fmtILS(p.amount)}</td>
          <td><span class="status-badge ${STATUS_CLASS[p.status]}">${p.status}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <div style="margin-top:8px;font-size:12.5px;color:var(--muted);">סה"כ פריסה: <b>${fmtILS(incomeDraftPayments.reduce((s,p)=>s+p.amount,0))}</b> מתוך <b>${fmtILS(total)}</b></div>
  `;
  document.getElementById('saveIncomeBtn').disabled = false;
}

function updateDraftPayment(i, field, val){
  incomeDraftPayments[i][field] = field==='amount'? round2(parseMoneyString(val)) : val;
  buildIncomePreview('manual', incomeDraftPayments);
}

function saveIncomeInvoice(editId){
  const customer = document.getElementById('f_customer').value.trim();
  const invoiceNumber = document.getElementById('f_invoiceNumber').value.trim();
  const invoiceDate = document.getElementById('f_invoiceDate').value;
  const notes = document.getElementById('f_notes').value;
  const status = document.getElementById('f_status').value;

  // A simple invoice (no split, no checks) shouldn't require clicking
  // "חשב תצוגה מקדימה" first - build the breakdown automatically if needed.
  if(!incomeDraftPayments){
    buildIncomePreview();
  }

  const totalAmount = incomeDraftPayments ? round2(incomeDraftPayments.reduce((s,p)=>s+p.amount,0)) : parseMoneyString(document.getElementById('f_totalAmount').value);
  const isCredit = incomeInvoiceType === 'credit';

  if(!customer || !invoiceNumber || !invoiceDate || totalAmount===0 || !incomeDraftPayments){
    showToast('יש למלא את כל השדות החיוניים (לקוח, מספר חשבונית, תאריך וסכום תקין)', true); return;
  }
  if(isCredit && totalAmount>0){
    showToast('חשבונית זיכוי - יש להזין את הסכום כמספר שלילי', true); return;
  }
  if(!isCredit && totalAmount<0){
    showToast('סכום חשבונית רגילה חייב להיות חיובי (עבור זיכוי, בחר "חשבונית זיכוי" למעלה)', true); return;
  }

  const dup = DB.incomeInvoices.find(i=> i.invoiceNumber===invoiceNumber && i.id!==editId);
  const doSave = ()=>{
    incomeDraftPayments.forEach(p=> p.status = p.status||status);
    if(editId){
      const inv = DB.incomeInvoices.find(i=>i.id===editId);
      Object.assign(inv, {customer, invoiceNumber, invoiceDate, totalAmount, notes, isCredit, splitType: currentSplitType, numPayments: incomeDraftPayments.length, payments: incomeDraftPayments.map(p=>({...p, id:p.id||uid('ipay'), status: p.status||status})), updatedAt: nowISO()});
      logAudit('incomeInvoice', editId, 'update');
    } else {
      const newInv = {
        id: uid('inv'), customer, invoiceNumber, invoiceDate, totalAmount, notes, isCredit,
        splitType: currentSplitType, numPayments: incomeDraftPayments.length,
        payments: incomeDraftPayments.map(p=>({...p, id:uid('ipay'), status})),
        createdBy: DB.currentUser, createdAt: nowISO(), updatedAt: nowISO()
      };
      DB.incomeInvoices.push(newInv);
      logAudit('incomeInvoice', newInv.id, 'create');
      if(customer && !DB.customers.find(c=>c.name===customer)) DB.customers.push({id:uid('cust'), name:customer});
    }
    saveDB();
    showToast('הנתונים נשמרו בהצלחה');
    const firstPaymentYear = incomeDraftPayments.length? Number(incomeDraftPayments[0].date.slice(0,4)) : new Date().getFullYear();
    navigateTo('income-table', {year: firstPaymentYear});
  };

  if(dup){
    confirmDialog(`קיימת במערכת חשבונית עם מספר <b>${invoiceNumber}</b>. האם ברצונך להמשיך?`, doSave);
  } else {
    doSave();
  }
}

function updateInvoiceField(invId, field, rawValue){
  const inv = DB.incomeInvoices.find(i=>i.id===invId);
  if(!inv) return;

  const applyUpdate = ()=>{
    if(field==='customer'){
      const old = inv.customer; inv.customer = rawValue.trim();
      if(inv.customer && !DB.customers.find(c=>c.name===inv.customer)) DB.customers.push({id:uid('cust'), name:inv.customer});
      logAudit('incomeInvoice', invId, 'update', 'customer', old, inv.customer);
    } else if(field==='invoiceNumber'){
      const old = inv.invoiceNumber; inv.invoiceNumber = rawValue.trim();
      logAudit('incomeInvoice', invId, 'update', 'invoiceNumber', old, inv.invoiceNumber);
    } else if(field==='totalAmount'){
      const newTotal = parseMoneyString(rawValue);
      const old = inv.totalAmount;
      inv.totalAmount = newTotal;
      // re-split the whole payment series as if the invoice were freshly entered with the new total,
      // so every month/dashboard/report that depends on these payments is automatically correct
      const n = inv.payments.length;
      if(n<=1){
        if(inv.payments[0]) inv.payments[0].amount = newTotal;
      } else if(inv.splitType==='manual'){
        const oldTotal = old || inv.payments.reduce((s,p)=>s+p.amount,0) || 1;
        let sum = 0;
        inv.payments.forEach((p,i)=>{
          if(i===n-1){ p.amount = round2(newTotal - sum); }
          else { p.amount = round2(p.amount * (newTotal/oldTotal)); sum = round2(sum+p.amount); }
        });
      } else {
        const per = Math.trunc((newTotal/n)*100)/100;
        let sum = 0;
        inv.payments.forEach((p,i)=>{
          if(i===n-1){ p.amount = round2(newTotal - sum); }
          else { p.amount = per; sum = round2(sum+per); }
        });
      }
      logAudit('incomeInvoice', invId, 'update', 'totalAmount', old, newTotal);
    } else if(field==='invoiceDate'){
      const old = inv.invoiceDate; inv.invoiceDate = rawValue;
      logAudit('incomeInvoice', invId, 'update', 'invoiceDate', old, rawValue);
    } else if(field==='dueDate'){
      if(inv.payments.length===1){
        const old = inv.payments[0].date; inv.payments[0].date = rawValue;
        logAudit('incomePayment', inv.payments[0].id, 'update', 'date', old, rawValue);
      }
    }
    inv.updatedAt = nowISO();
    saveDB();
    showToast('הנתונים נשמרו בהצלחה - התזרים והדוחות עודכנו בהתאם');
    renderCurrentView();
  };

  if(field==='invoiceNumber'){
    const dup = DB.incomeInvoices.find(i=> i.invoiceNumber===rawValue.trim() && i.id!==invId);
    if(dup){ confirmDialog(`קיימת במערכת חשבونית עם מספר <b>${rawValue.trim()}</b>. האם ברצונך להמשיך?`, applyUpdate); return; }
  }
  applyUpdate();
}

function updateInvoicePaymentDate(invId, payId, newDate){
  const inv = DB.incomeInvoices.find(i=>i.id===invId);
  if(!inv) return;
  const p = inv.payments.find(x=>x.id===payId);
  if(!p) return;
  const old = p.date;
  p.date = newDate;
  inv.updatedAt = nowISO();
  logAudit('incomePayment', payId, 'update', 'date', old, newDate);
  saveDB();
  showToast('הנתונים נשמרו בהצלחה - התזרים והדוחות עודכנו בהתאם');
  renderCurrentView();
}

function deleteWholeInvoice(invId){
  confirmDialog('האם אתה בטוח שברצונך למחוק חשבונית זו על כל תשלומיה?', ()=>{
    const inv = DB.incomeInvoices.find(i=>i.id===invId);
    if(!inv) return;
    DB.recycleBin.push({id:uid('rb'), entity:'incomeInvoice', record:inv, deletedAt:nowISO(), deletedBy:DB.currentUser});
    logAudit('incomeInvoice', invId, 'delete');
    DB.incomeInvoices = DB.incomeInvoices.filter(i=>i.id!==invId);
    saveDB(); showToast('החשבונית נמחקה'); renderCurrentView();
  });
}

function renderIncomeTableView(el){
  const st = viewState;
  const year = st.year || new Date().getFullYear();
  const selMonth = st.month || null; // 'YYYY-MM' or null = all
  const filters = st.filters || {};

  const yearMonths = Array.from({length:12},(_,i)=> year+'-'+String(i+1).padStart(2,'0'));
  const monthCards = yearMonths.map(mk=>{
    const pays = allIncomePayments().filter(p=>monthKey(p.date)===mk);
    const expected = pays.reduce((s,p)=>s+p.amount,0);
    const actual = pays.reduce((s,p)=> s+(p.status==='שולם'?p.amount:(p.paidAmount||0)),0);
    const remaining = round2(expected-actual);
    const late = pays.filter(p=>p.status==='באיחור').length;
    return {mk, invCount: new Set(pays.map(p=>p.invoiceId)).size, expected, actual, remaining, late};
  });

  const allPays = allIncomePayments();
  let rows = selMonth ? allPays.filter(p=>monthKey(p.date)===selMonth) : allPays.filter(p=>p.date.slice(0,4)===String(year));
  if(filters.customer) rows = rows.filter(p=>p.customer===filters.customer);
  if(filters.invoiceNumber) rows = rows.filter(p=>p.invoiceNumber.includes(filters.invoiceNumber));
  if(filters.status) rows = rows.filter(p=>p.status===filters.status);
  if(filters.minAmount) rows = rows.filter(p=>p.amount>=Number(filters.minAmount));
  if(filters.maxAmount) rows = rows.filter(p=>p.amount<=Number(filters.maxAmount));
  if(filters.search){
    const q = filters.search.toLowerCase();
    rows = rows.filter(p=> (p.customer||'').toLowerCase().includes(q) || (p.invoiceNumber||'').toLowerCase().includes(q) || (p.notes||'').toLowerCase().includes(q));
  }
  rows.sort((a,b)=> a.date<b.date?1:-1);

  const customers = [...new Set(DB.incomeInvoices.map(i=>i.customer))];

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="toolbar">
        <div class="year-switch">
          <button onclick="changeIncomeYear(-1)">›</button>
          <span>${year}</span>
          <button onclick="changeIncomeYear(1)">‹</button>
        </div>
        <button class="btn btn-green btn-sm" onclick="navigateTo('income-entry')">+ חשבונית חדשה</button>
      </div>
      <div class="months-strip">
        <div class="month-chip ${!selMonth?'active':''}" onclick="selectIncomeMonth(null)">כל השנה</div>
        ${monthCards.map(m=>`<div class="month-chip ${selMonth===m.mk?'active':''}" onclick="selectIncomeMonth('${m.mk}')">${HE_MONTHS[Number(m.mk.split('-')[1])-1]}${m.late?' 🔴':''}</div>`).join('')}
      </div>
      <div class="grid4">
        ${monthCards.map(m=>`
          <div class="month-card ${m.remaining>0?'zero':'pos'}" style="cursor:pointer;padding:12px;" onclick="selectIncomeMonth('${m.mk}')">
            <div class="mhead"><div class="mname" style="font-size:13px;">${HE_MONTHS[Number(m.mk.split('-')[1])-1]}</div>${m.late?`<div class="tag neg">${m.late} באיחור</div>`:''}</div>
            <div style="font-size:12px;color:var(--muted);">צפוי: <b style="color:var(--ink)">${fmtILS(m.expected)}</b></div>
            <div style="font-size:12px;color:var(--muted);">התקבל: <b style="color:var(--green)">${fmtILS(m.actual)}</b></div>
            <div style="font-size:12px;color:var(--muted);">יתרה: <b style="color:${m.remaining>0?'var(--orange)':'var(--muted)'}">${fmtILS(m.remaining)}</b></div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px;">${m.invCount} חשבוניות</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card chart-card">
      <div class="section-title" style="margin-top:0;">📊 גרף הכנסות והוצאות לפי תאריך (רק תאריכים עם תנועה)</div>
      ${(()=>{
        const expScope = selMonth ? allExpensePayments().filter(p=>monthKey(p.date)===selMonth) : allExpensePayments().filter(p=>p.date.slice(0,4)===String(year));
        const byDate = {};
        rows.forEach(p=>{
          byDate[p.date] = byDate[p.date]||{income:0,expense:0,incomeDetail:[],expenseDetail:[]};
          byDate[p.date].income += p.amount;
          byDate[p.date].incomeDetail.push({label:`${p.isCredit?'🟣 זיכוי - ':''}${p.customer} (חשבונית ${p.invoiceNumber})`, amount:p.amount});
        });
        expScope.forEach(p=>{
          byDate[p.date] = byDate[p.date]||{income:0,expense:0,incomeDetail:[],expenseDetail:[]};
          byDate[p.date].expense += p.amount;
          byDate[p.date].expenseDetail.push({label:`${p.supplier} (${p.type})`, amount:p.amount});
        });
        const entries = Object.keys(byDate).sort().map(d=>({label: fmtDateShort(d), income: byDate[d].income, expense: byDate[d].expense, incomeDetail: byDate[d].incomeDetail, expenseDetail: byDate[d].expenseDetail, expenseStack: groupExpensesByType(expScope.filter(p=>p.date===d))}));
        return renderBarChart(entries, [{key:'income', color:'var(--green)', name:'הכנסות'},{key:'expense', color:'var(--red)', name:'הוצאות'}]);
      })()}
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="search-box"><input type="text" placeholder="חיפוש לפי לקוח, מס' חשבונית, הערות..." value="${filters.search||''}" oninput="setIncomeFilter('search',this.value)"><span class="ic">🔍</span></div>
        <div class="filters">
          <select onchange="setIncomeFilter('customer',this.value)"><option value="">כל הלקוחות</option>${customers.map(c=>`<option ${filters.customer===c?'selected':''}>${c}</option>`).join('')}</select>
          <select onchange="setIncomeFilter('status',this.value)"><option value="">כל הסטטוסים</option>${STATUSES.map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select>
          <input type="number" placeholder="סכום מינ׳" style="width:100px" value="${filters.minAmount||''}" oninput="setIncomeFilter('minAmount',this.value)">
          <input type="number" placeholder="סכום מקס׳" style="width:100px" value="${filters.maxAmount||''}" oninput="setIncomeFilter('maxAmount',this.value)">
          <button class="btn btn-ghost btn-sm" onclick="clearIncomeFilters()">נקה סינון</button>
        </div>
      </div>
      <div class="table-wrap">
        <table><thead><tr>
          <th>לקוח</th><th>מס׳ חשבונית</th><th>מועד תשלום</th><th>סכום תשלום</th><th>סטטוס</th><th>שולם בפועל</th><th>יתרה</th><th>הערות</th><th>פעולות</th>
        </tr></thead>
        <tbody>
        ${rows.length? rows.map(p=>{
          const paid = p.status==='שולם'?p.amount:(p.paidAmount||0);
          const remaining = round2(p.amount-paid);
          return `<tr ${p.isCredit?'style="background:#f3e8ff;"':''}>
            <td>${p.isCredit?'<span style="background:#8b5cf6;color:#fff;border-radius:6px;padding:2px 7px;font-size:10.5px;margin-left:6px;">🟣 זיכוי</span>':''}${p.customer}</td><td>${p.invoiceNumber}</td><td>${fmtDateHe(p.date)}</td><td><b>${fmtILS(p.amount)}</b></td>
            <td><span class="status-badge ${STATUS_CLASS[p.status]}">${p.status}</span></td>
            <td>${fmtILS(paid)}</td><td>${fmtILS(remaining)}</td><td>${p.notes||''}</td>
            <td><div class="rowbtns">
              <button class="iconsm" title="צפייה" onclick="viewIncomePayment('${p.invoiceId}','${p.id}')">👁</button>
              <button class="iconsm" title="עריכה" onclick="editIncomeInvoice('${p.invoiceId}')">✏️</button>
              <button class="iconsm" title="סימון כשולם" onclick="markIncomePaid('${p.invoiceId}','${p.id}')">✅</button>
              <button class="iconsm" title="דחיית מועד" onclick="postponeIncomePayment('${p.invoiceId}','${p.id}')">⏩</button>
              <button class="iconsm" title="שכפול חשבונית" onclick="duplicateIncomeInvoice('${p.invoiceId}')">📄</button>
              <button class="iconsm" title="מחיקה" onclick="deleteIncomePayment('${p.invoiceId}','${p.id}')">🗑</button>
            </div></td>
          </tr>`;
        }).join('') : `<tr><td colspan="9"><div class="empty-state"><div class="ic">📭</div>לא נמצאו רשומות תואמות</div></td></tr>`}
        </tbody></table>
      </div>
    </div>
  `;
}

function changeIncomeYear(delta){ viewState.year = (viewState.year||new Date().getFullYear())+delta; renderCurrentView(); }
function selectIncomeMonth(mk){ viewState.month = mk; renderCurrentView(); }
function setIncomeFilter(k,v){ viewState.filters = viewState.filters||{}; viewState.filters[k]=v; renderCurrentView(); document.querySelector('.search-box input')?.focus(); }
function clearIncomeFilters(){ viewState.filters={}; renderCurrentView(); }

function findIncomeInv(invId){ return DB.incomeInvoices.find(i=>i.id===invId); }

function viewIncomePayment(invId, payId){
  const inv = findIncomeInv(invId); const p = inv.payments.find(x=>x.id===payId);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:480px;">
        <div class="modal-head"><h3>👁 פרטי תשלום</h3><button class="closeX" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <p><b>לקוח:</b> ${inv.customer}</p>
          <p><b>מספר חשבונית:</b> ${inv.invoiceNumber}</p>
          <p><b>תאריך חשבונית:</b> ${fmtDateHe(inv.invoiceDate)}</p>
          <p><b>סכום חשבונית כולל:</b> ${fmtILS(inv.totalAmount)}</p>
          <p><b>תשלום מספר:</b> ${p.paymentNumber} מתוך ${inv.numPayments}</p>
          <p><b>מועד תשלום:</b> ${fmtDateHe(p.date)}</p>
          <p><b>סכום תשלום:</b> ${fmtILS(p.amount)}</p>

          <p><b>הערות:</b> ${inv.notes||'-'}</p>
          <p style="color:var(--muted);font-size:12px;"><b>נוצר:</b> ${fmtDateHe(inv.createdAt.slice(0,10))} ע"י ${inv.createdBy||'-'}</p>

        <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">סגור</button></div>
      </div>
    </div>`;
}

function editIncomeInvoice(invId){
  const inv = findIncomeInv(invId);
  currentSplitType = inv.splitType||'equal';
  currentView='income-entry';
  renderSidenav(); renderTopbar();
  document.getElementById('viewsSlot').innerHTML = `<div class="view active" id="view-income-entry"></div>`;
  renderIncomeEntryView(document.getElementById('view-income-entry'), inv);
}

function markIncomePaid(invId, payId){
  const inv = findIncomeInv(invId); const p = inv.payments.find(x=>x.id===payId);
  const old = p.status;
  p.status='שולם'; p.paidAmount=p.amount; inv.updatedAt=nowISO();
  logAudit('incomePayment', payId, 'update', 'status', old, 'שולם');
  saveDB(); showToast('הנתונים נשמרו בהצלחה'); renderCurrentView();
}

function postponeIncomePayment(invId, payId){
  const inv = findIncomeInv(invId); const p = inv.payments.find(x=>x.id===payId);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg"><div class="modal" style="max-width:380px;">
      <div class="modal-head"><h3>⏩ עריכת תשלום</h3><button class="closeX" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>מועד תשלום</label><input type="date" id="newDateInput" value="${p.date}"></div>
        <div class="field"><label>סכום (ש"ח) - ניתן לתקן במידת הצורך</label><input ${moneyInputAttrs()} id="newAmountInput" value="${fmtMoneyInputValue(p.amount)}"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
        <button class="btn btn-blue" onclick="confirmPostpone('${invId}','${payId}')">שמור</button>
      </div>
    </div></div>`;
}
function confirmPostpone(invId, payId){
  const inv = findIncomeInv(invId); const p = inv.payments.find(x=>x.id===payId);
  const oldDate=p.date, oldAmount=p.amount;
  const newDate = document.getElementById('newDateInput').value;
  const newAmount = round2(parseMoneyString(document.getElementById('newAmountInput').value)||p.amount);
  if(newDate!==oldDate){ p.date=newDate; p.status='נדחה'; logAudit('incomePayment', payId, 'update', 'date', oldDate, newDate); }
  if(newAmount!==oldAmount){ p.amount=newAmount; logAudit('incomePayment', payId, 'update', 'amount', oldAmount, newAmount); }
  inv.updatedAt=nowISO();
  saveDB(); closeModal(); showToast('הנתונים נשמרו בהצלחה'); renderCurrentView();
}

function duplicateIncomeInvoice(invId){
  const inv = findIncomeInv(invId);
  const copy = JSON.parse(JSON.stringify(inv));
  copy.id = uid('inv'); copy.invoiceNumber = inv.invoiceNumber+'-copy';
  copy.payments = copy.payments.map(p=>({...p, id:uid('ipay'), status:'צפוי', paidAmount:0}));
  copy.createdAt=nowISO(); copy.updatedAt=nowISO(); copy.createdBy=DB.currentUser;
  DB.incomeInvoices.push(copy);
  logAudit('incomeInvoice', copy.id, 'duplicate', null, invId, copy.id);
  saveDB(); showToast('החשבונית שוכפלה בהצלחה'); renderCurrentView();
}

function deleteIncomePayment(invId, payId){
  confirmDialog('האם אתה בטוח שברצונך למחוק רשומה זו?', ()=>{
    const inv = findIncomeInv(invId);
    const idx = inv.payments.findIndex(x=>x.id===payId);
    const [removed] = inv.payments.splice(idx,1);
    DB.recycleBin.push({id:uid('rb'), entity:'incomePayment', record:{...removed, invoiceId:invId}, deletedAt:nowISO(), deletedBy:DB.currentUser});
    logAudit('incomePayment', payId, 'delete');
    if(inv.payments.length===0){
      DB.incomeInvoices = DB.incomeInvoices.filter(i=>i.id!==invId);
    }
    saveDB(); showToast('הרשומה נמחקה'); renderCurrentView();
  });
}
