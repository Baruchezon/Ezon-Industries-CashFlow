function onExpenseAmountOrDateChange(){
  // Critical safety net: if the user edits the top-level date/count/amount fields on an
  // already-loaded expense (e.g. correcting a due date) without re-clicking "חשב תצוגה מקדימה",
  // the change must still take effect on save - it must never be silently discarded.
  const num = Math.max(1, parseInt(document.getElementById('f_expNum').value)||1);
  if(expenseDraftPayments && expenseDraftPayments.length===1 && num===1){
    // single payment - no ambiguity, sync the date directly onto the actual draft payment
    const newDate = document.getElementById('f_expFirstDate').value;
    if(newDate) expenseDraftPayments[0].date = newDate;
  } else {
    // payment count changed, or draft not yet built - force a full, fresh rebuild
    expenseDraftPayments = null;
  }
  buildExpensePreview();
}

function setExpenseSplitType(t){
  expenseSplitType = t;
  document.querySelectorAll('.pill[data-esplit]').forEach(p=>p.classList.toggle('active', p.dataset.esplit===t));
  buildExpensePreview();
}

function setExpenseAmountMode(mode){
  expenseAmountMode = mode;
  document.querySelectorAll('.pill[data-amode]').forEach(p=> p.classList.toggle('active', p.dataset.amode===mode));
  const splitWrap = document.getElementById('splitTypeWrap');
  if(splitWrap) splitWrap.style.display = mode==='perPayment' ? 'none' : 'flex';
  const label = document.getElementById('f_expTotalLabel');
  if(label) label.textContent = mode==='perPayment' ? 'סכום ההוצאה החודשית (ש"ח) *' : 'הסכום הכולל כולל מע"מ (ש"ח) *';
  const dateLabel = document.getElementById('f_expFirstDateLabel');
  if(dateLabel) dateLabel.textContent = mode==='perPayment' ? 'יום בחודש שההוצאה יורדת (תשלום ראשון) *' : 'מועד הפירעון הראשון *';
  expenseDraftPayments = null;
  buildExpensePreview();
}

function buildExpensePreview(forceType, existingPayments){
  const type = document.getElementById('f_expType').value;
  let firstDate = document.getElementById('f_expFirstDate').value || todayISO();
  const enteredAmount = parseMoneyString(document.getElementById('f_expTotal').value);
  const num = Math.max(1, parseInt(document.getElementById('f_expNum').value)||1);
  const freq = Number(document.getElementById('f_expFreq').value)||1;
  const splitType = forceType || expenseSplitType;
  const wrap = document.getElementById('expensePreviewWrap');

  if(enteredAmount<=0){ showToast('יש להזין סכום תקין', true); return; }

  // credit card default date suggestion (only when creating new, first payment date left as txn date)
  if(type==='כרטיסי אשראי' && !existingPayments){
    const suggested = creditCardDefaultDate(firstDate);
    // if user hasn't touched due date input separately, use suggested as the actual due date baseline
    firstDate = suggested;
  }

  // "per payment" mode: the entered amount is the FIXED amount for each payment/check
  // (e.g. "6 checks of 4,000 ש"ח each" instead of "24,000 ש"ח split into 6") - the true total is derived
  const total = expenseAmountMode==='perPayment' ? round2(enteredAmount*num) : enteredAmount;

  if(existingPayments){
    expenseDraftPayments = existingPayments.map(p=>({...p}));
  } else if(expenseAmountMode==='perPayment'){
    expenseDraftPayments = Array.from({length:num},(_,i)=>({
      paymentNumber:i+1, date: addMonths(firstDate, i*freq), amount: enteredAmount, status:'צפוי', paidAmount:0
    }));
  } else if(splitType==='equal'){
    expenseDraftPayments = buildEqualSplit(total, num, firstDate, freq);
  } else {
    if(!expenseDraftPayments || expenseDraftPayments.length!==num){
      expenseDraftPayments = buildEqualSplit(total, num, firstDate, freq);
    }
  }

  const canEditRows = expenseAmountMode!=='perPayment' && splitType==='manual';
  wrap.innerHTML = `
    <div class="section-title" style="margin-top:0;">👁 תצוגה מקדימה</div>
    ${type==='כרטיסי אשראי'?`<p style="font-size:12.5px;color:var(--blue);">מועד חיוב ברירת מחדל חושב אוטומטית ל-15 לחודש העוקב.</p>`:''}
    ${expenseAmountMode==='perPayment'?`<p style="font-size:12.5px;color:var(--blue);">כל חודש יירשם תשלום בסך ${fmtILS(enteredAmount)} - סה"כ ${num} תשלומים = ${fmtILS(total)}.</p>`:''}
    <div class="table-wrap">
      <table><thead><tr><th>#</th><th>מועד פירעון</th><th>סכום</th><th>סטטוס</th></tr></thead>
      <tbody>
      ${expenseDraftPayments.map((p,i)=>`
        <tr>
          <td>${p.paymentNumber}</td>
          <td>${canEditRows?`<input type="date" style="min-width:140px" value="${p.date}" onchange="updateExpenseDraftPayment(${i},'date',this.value)">`:fmtDateHe(p.date)}</td>
          <td>${canEditRows?`<input ${moneyInputAttrs()} style="min-width:110px" value="${fmtMoneyInputValue(p.amount)}" onchange="updateExpenseDraftPayment(${i},'amount',this.value)">`:fmtILS(p.amount)}</td>
          <td><span class="status-badge ${STATUS_CLASS[p.status]}">${p.status}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <div style="margin-top:8px;font-size:12.5px;color:var(--muted);">סה"כ פריסה: <b>${fmtILS(expenseDraftPayments.reduce((s,p)=>s+p.amount,0))}</b> מתוך <b>${fmtILS(total)}</b></div>
  `;
  document.getElementById('saveExpenseBtn').disabled=false;
}

function updateExpenseDraftPayment(i, field, val){
  expenseDraftPayments[i][field] = field==='amount'? round2(parseMoneyString(val)) : val;
  buildExpensePreview('manual', expenseDraftPayments);
}

function collectExtraFields(type){
  if(type === "צ'קים בחוץ"){
    return { firstCheckNum: document.getElementById('ex_firstCheckNum')?.value||'', bankName: document.getElementById('ex_bankName')?.value||'', accountNum: document.getElementById('ex_accountNum')?.value||'' };
  }
  if(type === 'כרטיסי אשראי'){
    return { ccCompany: document.getElementById('ex_ccCompany')?.value||'', ccLast4: document.getElementById('ex_ccLast4')?.value||'' };
  }
  return {};
}

function saveExpense(editId){
  const type = document.getElementById('f_expType').value;
  const supplier = document.getElementById('f_supplier').value.trim();
  const description = document.getElementById('f_description').value.trim();
  const totalAmount = expenseDraftPayments ? round2(expenseDraftPayments.reduce((s,p)=>s+p.amount,0)) : parseMoneyString(document.getElementById('f_expTotal').value);
  const paymentMethod = document.getElementById('f_payMethod').value;
  const reference = document.getElementById('f_reference').value;
  const notes = document.getElementById('f_expNotes').value;
  const isRecurring = document.getElementById('f_isRecurring').checked;
  const endDate = document.getElementById('f_endDate').value || null;
  const frequency = Number(document.getElementById('f_expFreq').value)||1;
  const extra = collectExtraFields(type);

  if(!supplier || totalAmount<=0 || !expenseDraftPayments){
    showToast('יש למלא את כל השדות החיוניים ולחשב תצוגה מקדימה', true); return;
  }

  // duplicate-ish detection: same supplier+amount+date
  const potentialDup = DB.expenses.find(e=> e.id!==editId && e.supplier===supplier && e.totalAmount===totalAmount && e.payments[0] && expenseDraftPayments[0] && e.payments[0].date===expenseDraftPayments[0].date);

  const doSave = ()=>{
    let payments = expenseDraftPayments.map(p=>({...p, id:p.id||uid('epay')}));
    // if recurring, extend with generated future payments beyond what's manually specified
    if(isRecurring && payments.length===1){
      payments = generateRecurringPayments(totalAmount, payments[0].date, frequency, endDate, 24);
      payments = payments.map(p=>({...p, id:uid('epay')}));
    }
    if(editId){
      const exObj = DB.expenses.find(e=>e.id===editId);
      Object.assign(exObj, {type, supplier, description, totalAmount, numPayments:payments.length, frequency, paymentMethod, reference, notes, isRecurring, endDate, extra, payments, updatedAt: nowISO()});
      logAudit('expense', editId, 'update');
    } else {
      const newEx = {
        id: uid('exp'), type, supplier, description, totalAmount, numPayments: payments.length,
        frequency, paymentMethod, reference, notes, isRecurring, endDate, extra, payments,
        createdBy: DB.currentUser, createdAt: nowISO(), updatedAt: nowISO()
      };
      DB.expenses.push(newEx);
      logAudit('expense', newEx.id, 'create');
      if(supplier && !DB.suppliers.find(s=>s.name===supplier)) DB.suppliers.push({id:uid('sup'), name:supplier});
    }
    saveDB();
    showToast('הנתונים נשמרו בהצלחה');
    const firstPaymentYear = payments.length? Number(payments[0].date.slice(0,4)) : new Date().getFullYear();
    navigateTo('expense-table', {year: firstPaymentYear});
  };

  if(potentialDup){
    confirmDialog(`נמצאה רשומת הוצאה דומה (אותו ספק, סכום ותאריך). האם ברצונך להמשיך לשמור בכל זאת?`, doSave);
  } else {
    doSave();
  }
}

function confirmExpensePostpone(expId, payId){
  const ex = findExpense(expId); const p = ex.payments.find(x=>x.id===payId);
  const oldDate=p.date, oldAmount=p.amount;
  const newDate = document.getElementById('newExpDateInput').value;
  const newAmount = round2(parseMoneyString(document.getElementById('newExpAmountInput').value)||p.amount);
  if(newDate!==oldDate){ p.date=newDate; p.status='נדחה'; logAudit('expensePayment', payId, 'update', 'date', oldDate, newDate); }
  if(newAmount!==oldAmount){ p.amount=newAmount; logAudit('expensePayment', payId, 'update', 'amount', oldAmount, newAmount); }
  ex.updatedAt=nowISO();
  saveDB(); closeModal(); showToast('הנתונים נשמרו בהצלחה'); renderCurrentView();
}

function deleteExpensePayment(expId, payId){
  confirmDialog('האם אתה בטוח שברצונך למחוק רשומה זו?', ()=>{
    const ex = findExpense(expId);
    const idx = ex.payments.findIndex(x=>x.id===payId);
    const [removed] = ex.payments.splice(idx,1);
    DB.recycleBin.push({id:uid('rb'), entity:'expensePayment', record:{...removed, expenseId:expId}, deletedAt:nowISO(), deletedBy:DB.currentUser});
    logAudit('expensePayment', payId, 'delete');
    if(ex.payments.length===0) DB.expenses = DB.expenses.filter(e=>e.id!==expId);
    saveDB(); showToast('הרשומה נמחקה'); renderCurrentView();
  });
}

function deleteWholeExpense(expId){
  confirmDialog('האם אתה בטוח שברצונך למחוק את ההוצאה כולה, כולל כל התשלומים העתידיים שלה?', ()=>{

    DB.recycleBin.push({id:uid('rb'), entity:'expense', record:ex, deletedAt:nowISO(), deletedBy:DB.currentUser});
    logAudit('expense', expId, 'delete');
    DB.expenses = DB.expenses.filter(e=>e.id!==expId);
    saveDB(); showToast('ההוצאה נמחקה'); renderCurrentView();
  });
}

          ${REPORT_TYPES.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${r.label}</option>`).join('')}
        </select>
        <div class="filters">
          <select id="reportYear" onchange="viewState.reportYear=this.value; renderCurrentView();">
            ${[0,1,2].map(i=>{const y=new Date().getFullYear()-i; return `<option value="${y}" ${(viewState.reportYear||new Date().getFullYear())==y?'selected':''}>${y}</option>`;}).join('')}
          </select>
          ${monthlyReportTypes.includes(sel) ? `
          <select id="reportMonthFilter" onchange="viewState.reportMonth=this.value; renderCurrentView();">
            <option value="">כל השנה</option>
            ${HE_MONTHS.map((m,i)=>`<option value="${i+1}" ${String(viewState.reportMonth)===String(i+1)?'selected':''}>${m} בלבד</option>`).join('')}
          </select>` : ''}
          ${SCOPABLE_REPORTS.includes(sel) ? `
          <div class="pill-toggle">
            <div class="pill ${(viewState.reportScope||'all')==='all'?'active':''}" onclick="viewState.reportScope='all'; renderCurrentView();">משולב</div>
            <div class="pill ${viewState.reportScope==='income'?'active':''}" onclick="viewState.reportScope='income'; renderCurrentView();" style="color:${viewState.reportScope==='income'?'#fff':'var(--green)'};background:${viewState.reportScope==='income'?'var(--green)':''};">🟢 הכנסות בלבד</div>
            <div class="pill ${viewState.reportScope==='expense'?'active':''}" onclick="viewState.reportScope='expense'; renderCurrentView();" style="color:${viewState.reportScope==='expense'?'#fff':'var(--red)'};background:${viewState.reportScope==='expense'?'var(--red)':''};">🔴 הוצאות בלבד</div>
          </div>` : ''}
          <input type="text" id="reportSearch" placeholder="🔍 סינון חופשי בטבלה..." style="min-width:160px;" value="${viewState.reportSearch||''}" oninput="viewState.reportSearch=this.value; renderReportBody(viewState.reportId||'income-by-month', viewState.reportYear||new Date().getFullYear());">
          <button class="btn btn-blue btn-sm" onclick="downloadReportPDF()">📄 הורדה כ-PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 הדפסה</button>
          <button class="btn btn-green btn-sm" onclick="exportReportStyledExcel()">📊 הורדה כאקסל מעוצב</button>
          <button class="btn btn-ghost btn-sm" onclick="exportReportCSV()">⬇️ CSV גולמי</button>
        </div>
      </div>
    </div>
    <div class="card" id="reportBody"></div>
  `;
  renderReportBody(sel, viewState.reportYear||new Date().getFullYear());
}
function filterReportMonth(mk){
  // clicking a month row in any monthly report scopes the whole report to just that month
  viewState.reportMonth = String(Number(mk.split('-')[1]));
  renderCurrentView();
}


let lastReportRows = {headers:[], rows:[], summary:[], title:''};

const SCOPABLE_REPORTS = ['monthly-cashflow-report','annual-cashflow','forecast-4m','expected-vs-actual'];
const REPORT_COLUMN_ROLES = {
  'income-by-month': ['month','date','text','text','text','income','text'],
  'expense-by-month': ['month','date','text','text','text','text','expense','text'],
  'monthly-cashflow-report': ['date','income','expense','net','net'],
  'annual-cashflow': ['month','income','expense','net','net'],
  'unpaid-customers': ['text','text','income','income','income'],
  'checks-outstanding': ['text','text','date','expense','text'],
  'credit-cards': ['text','text','date','expense','text'],
  'fixed-expenses': ['text','text','expense','text','text'],
  'mid-month-cutoff': ['month','net','net'],
  'forecast-4m': ['month','income','expense','net','net'],
  'expected-vs-actual': ['month','income','income','expense','expense','net']
};
function reportMonthRange(){
  const rm = viewState.reportMonth;
  if(rm){ return [Number(rm)-1]; }
  return Array.from({length:12},(_,i)=>i);
}

function renderReportBody(id, year){
  const body = document.getElementById('reportBody');
  const title = REPORT_TYPES.find(r=>r.id===id)?.label||'';
  const monthlyReportTypes = ['income-by-month','expense-by-month','annual-cashflow','mid-month-cutoff','expected-vs-actual'];
  const isMonthlyReport = monthlyReportTypes.includes(id);
  let headers=[], rows=[], summary=[], rowMonthKeys=[];

  if(id==='income-by-month'){
    headers = ['חודש','תאריך','לקוח','מס\' חשבונית','הערות','סכום','סטטוס'];
    let totExpected=0, totActual=0, totCount=0, totLate=0;
    reportMonthRange().forEach(m=>{
      const mk = year+'-'+String(m+1).padStart(2,'0');
      const s = monthStats(mk,'expected'); const sa = monthStats(mk,'actual');
      s.incomePayments.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(p=>{
        rows.push([monthLabel(mk), fmtDateHe(p.date), (p.isCredit?'🟣 זיכוי - ':'')+p.customer, p.invoiceNumber, p.notes||'-', fmtILS(p.amount), p.status]);
        rowMonthKeys.push(mk);
      });
      totExpected+=s.incomeTotal; totActual+=sa.incomeTotal; totCount+=s.countIncome; totLate+=s.lateIncome;
    });
    summary = [
      {label:'סה"כ הכנסות צפויות לשנה', value: fmtILS(totExpected), role:'income'},
      {label:'סה"כ שולם בפועל', value: fmtILS(totActual), role:'income'},
      {label:'יתרה לגבייה', value: fmtILS(round2(totExpected-totActual))},
      {label:'מס׳ חשבוניות', value: totCount},
      {label:'חשבוניות באיחור', value: totLate}
    ];
  } else if(id==='expense-by-month'){
    headers = ['חודש','תאריך','ספק','סוג הוצאה','תיאור','אמצעי תשלום','סכום','סטטוס'];
    let totExpected=0, totActual=0, totCount=0, totLate=0;
    reportMonthRange().forEach(m=>{
      const mk = year+'-'+String(m+1).padStart(2,'0');
      const s = monthStats(mk,'expected'); const sa = monthStats(mk,'actual');
      s.expensePayments.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(p=>{
        rows.push([monthLabel(mk), fmtDateHe(p.date), p.supplier, p.type, p.description||'-', p.paymentMethod||'-', fmtILS(p.amount), p.status]);
        rowMonthKeys.push(mk);
      });
      totExpected+=s.expenseTotal; totActual+=sa.expenseTotal; totCount+=s.countExpense; totLate+=s.lateExpense;
    });
    summary = [
      {label:'סה"כ הוצאות צפויות לשנה', value: fmtILS(totExpected), role:'expense'},
      {label:'סה"כ שולם בפועל', value: fmtILS(totActual), role:'expense'},
      {label:'יתרה לתשלום', value: fmtILS(round2(totExpected-totActual))},
      {label:'מס׳ הוצאות', value: totCount},
      {label:'הוצאות באיחור', value: totLate}
    ];
  } else if(id==='monthly-cashflow-report'){
    const mk = viewState.month || todayMonthKey();
    headers=['תאריך','הכנסות','הוצאות','נטו','יתרה מצטברת'];
    const days = dailyCashflow(mk,'expected');
    days.forEach(d=> rows.push([fmtDateHe(d.iso), fmtILS(d.incSum), fmtILS(d.expSum), fmtILS(d.net), fmtILS(d.closeBal)]));
    const totInc = days.reduce((s,d)=>s+d.incSum,0), totExp = days.reduce((s,d)=>s+d.expSum,0);
    summary = [
      {label:'חודש', value: monthLabel(mk)},
      {label:'סה"כ הכנסות', value: fmtILS(totInc), role:'income'},
      {label:'סה"כ הוצאות', value: fmtILS(totExp), role:'expense'},
      {label:'תזרים נטו לחודש', value: fmtILS(round2(totInc-totExp))},
      {label:'יתרת סגירה', value: days.length? fmtILS(days[days.length-1].closeBal) : fmtILS(0)}
    ];
  } else if(id==='annual-cashflow'){
    headers=['חודש','הכנסות','הוצאות','יתרה חודשית','יתרה מצטברת'];
    let totInc=0, totExp=0;
    reportMonthRange().forEach(m=>{
      const mk = year+'-'+String(m+1).padStart(2,'0');
      const s = monthStats(mk,'expected');
      rows.push([monthLabel(mk), fmtILS(s.incomeTotal), fmtILS(s.expenseTotal), fmtILS(s.balance), fmtILS(cumulativeBalanceThroughMonth(mk,'expected'))]);
      rowMonthKeys.push(mk);
      totInc+=s.incomeTotal; totExp+=s.expenseTotal;
    });
    summary = [
      {label:'סה"כ הכנסות לשנה', value: fmtILS(totInc), role:'income'},
      {label:'סה"כ הוצאות לשנה', value: fmtILS(totExp), role:'expense'},
      {label:'רווח/הפסד שנתי', value: fmtILS(round2(totInc-totExp))},
      {label:'יתרה מצטברת בסוף השנה', value: fmtILS(cumulativeBalanceThroughMonth(year+'-12','expected'))}
    ];
  } else if(id==='unpaid-customers'){
    headers=['לקוח','חשבונית','סכום כולל','שולם','יתרה'];
    let totRemaining=0;
    DB.incomeInvoices.forEach(inv=>{
      const paid = inv.payments.reduce((s,p)=>s+(p.status==='שולם'?p.amount:(p.paidAmount||0)),0);
      const remaining = round2(inv.totalAmount-paid);
      if(remaining>0){ rows.push([inv.customer, inv.invoiceNumber, fmtILS(inv.totalAmount), fmtILS(paid), fmtILS(remaining)]); totRemaining+=remaining; }
    });
    summary = [{label:'מס׳ חשבוניות פתוחות', value: rows.length}, {label:'סה"כ יתרה לגבייה', value: fmtILS(totRemaining)}];
  } else if(id==='late-payments'){
    headers=['סוג','גורם','תאריך','סכום','סטטוס'];
    let totIncLate=0, totExpLate=0;
    allIncomePayments().filter(p=>p.status==='באיחור').forEach(p=>{ rows.push(['הכנסה', p.customer, fmtDateHe(p.date), fmtILS(p.amount), p.status]); totIncLate+=p.amount; });
    allExpensePayments().filter(p=>p.status==='באיחור').forEach(p=>{ rows.push(['הוצאה', p.supplier, fmtDateHe(p.date), fmtILS(p.amount), p.status]); totExpLate+=p.amount; });
    summary = [{label:'הכנסות באיחור', value: fmtILS(totIncLate)}, {label:'הוצאות באיחור', value: fmtILS(totExpLate)}, {label:'סה"כ רשומות באיחור', value: rows.length}];
  } else if(id==='checks-outstanding'){
    headers=['ספק','בנק','מועד פירעון','סכום','סטטוס'];
    let tot=0;
    DB.expenses.filter(e=>e.type==="צ'קים בחוץ").forEach(e=> e.payments.forEach(p=>{ if(p.status!=='שולם'&&p.status!=='בוטל'){ rows.push([e.supplier, e.extra?.bankName||'-', fmtDateHe(p.date), fmtILS(p.amount), p.status]); tot+=p.amount; } }));
    summary = [{label:'מס׳ צ׳קים בחוץ', value: rows.length}, {label:'סה"כ סכום', value: fmtILS(tot)}];
  } else if(id==='credit-cards'){
    headers=['חברת אשראי','ספק','מועד חיוב','סכום','סטטוס'];
    let tot=0;
    DB.expenses.filter(e=>e.type==='כרטיסי אשראי').forEach(e=> e.payments.forEach(p=>{ rows.push([e.extra?.ccCompany||'-', e.supplier, fmtDateHe(p.date), fmtILS(p.amount), p.status]); tot+=p.amount; }));
    summary = [{label:'מס׳ חיובים', value: rows.length}, {label:'סה"כ חיובי אשראי', value: fmtILS(tot)}];
  } else if(id==='fixed-expenses'){
    headers=['ספק','תיאור','סכום קבוע','תדירות','תאריך סיום'];
    let tot=0;
    DB.expenses.filter(e=>e.isRecurring).forEach(e=>{ rows.push([e.supplier, e.description||'-', fmtILS(e.totalAmount), FREQ_OPTIONS.find(f=>f.v===e.frequency)?.l||e.frequency, e.endDate?fmtDateHe(e.endDate):'ללא תאריך סיום']); tot+=Number(e.totalAmount)||0; });
    summary = [{label:'מס׳ הוצאות קבועות', value: rows.length}, {label:'סה"כ לחיוב חודשי', value: fmtILS(tot)}];
  } else if(id==='mid-month-cutoff'){
    headers=['חודש','יתרה עד ה-15','יתרה לסוף חודש'];
    reportMonthRange().forEach(m=>{
      const mk = year+'-'+String(m+1).padStart(2,'0');
      const s = monthStats(mk,'expected');
      rows.push([monthLabel(mk), fmtILS(s.balance15), fmtILS(s.balance)]);
      rowMonthKeys.push(mk);
    });
    summary = [{label:'שנה', value: year}];
  } else if(id==='forecast-4m'){
    headers=['חודש','הכנסות','הוצאות','יתרה חודשית','יתרה מצטברת'];
    let totInc=0, totExp=0;
    for(let i=0;i<4;i++){
      const mk = addMonths(todayISO(),i).slice(0,7);
      const s = monthStats(mk,'expected');
      rows.push([monthLabel(mk), fmtILS(s.incomeTotal), fmtILS(s.expenseTotal), fmtILS(s.balance), fmtILS(cumulativeBalanceThroughMonth(mk,'expected'))]);
      totInc+=s.incomeTotal; totExp+=s.expenseTotal;
    }
    summary = [{label:'סה"כ הכנסות (4 חודשים)', value: fmtILS(totInc), role:'income'}, {label:'סה"כ הוצאות (4 חודשים)', value: fmtILS(totExp), role:'expense'}, {label:'רווח/הפסד תחזית', value: fmtILS(round2(totInc-totExp))}];
  } else if(id==='expected-vs-actual'){
    headers=['חודש','הכנסות צפוי','הכנסות בפועל','הוצאות צפוי','הוצאות בפועל','פער'];
    let totGap=0, totIncExp=0, totIncAct=0, totExpExp=0, totExpAct=0;
    reportMonthRange().forEach(m=>{
      const mk = year+'-'+String(m+1).padStart(2,'0');
      const se = monthStats(mk,'expected'), sa = monthStats(mk,'actual');
      const gap = round2((se.incomeTotal-se.expenseTotal)-(sa.incomeTotal-sa.expenseTotal));
      rows.push([monthLabel(mk), fmtILS(se.incomeTotal), fmtILS(sa.incomeTotal), fmtILS(se.expenseTotal), fmtILS(sa.expenseTotal), fmtILS(gap)]);
      rowMonthKeys.push(mk);
      totGap+=gap; totIncExp+=se.incomeTotal; totIncAct+=sa.incomeTotal; totExpExp+=se.expenseTotal; totExpAct+=sa.expenseTotal;
    });
    summary = [
      {label:'הכנסות צפוי', value: fmtILS(totIncExp), role:'income'},
      {label:'הכנסות בפועל', value: fmtILS(totIncAct), role:'income'},
      {label:'הוצאות צפוי', value: fmtILS(totExpExp), role:'expense'},
      {label:'הוצאות בפועל', value: fmtILS(totExpAct), role:'expense'},
      {label:'סה"כ פער שנתי (צפוי מול בפועל)', value: fmtILS(totGap)}
    ];
  }

  // scope filter: for reports combining income+expense, let the user narrow to
  // just one side - drop the other side's columns (and any pure "net" columns,
  // since those depend on both and don't make sense in a single-sided view)
  let roles = REPORT_COLUMN_ROLES[id];
  const scope = SCOPABLE_REPORTS.includes(id) ? (viewState.reportScope||'all') : 'all';
  if(roles && scope!=='all'){
    const keepIdx = roles.map((r,i)=> (r==='month'||r==='date'||r===scope) ? i : -1).filter(i=>i>=0);
    headers = keepIdx.map(i=>headers[i]);
    rows = rows.map(r=> keepIdx.map(i=>r[i]));
    roles = keepIdx.map(i=>roles[i]);
    summary = summary.filter(s=> !s.role || s.role===scope);
  }

  // general free-text filter across all report types - flexible filtering without
  // needing per-report-specific filter UI; matches against any visible cell text
  const searchQ = (viewState.reportSearch||'').trim().toLowerCase();
  if(searchQ){
    const keptRows = [], keptMonthKeys = [];
    rows.forEach((r,i)=>{
      if(r.some(c=> String(c).toLowerCase().includes(searchQ))){
        keptRows.push(r);
        if(rowMonthKeys.length) keptMonthKeys.push(rowMonthKeys[i]);
      }
    });
    rows = keptRows;
    if(rowMonthKeys.length) rowMonthKeys = keptMonthKeys;
  }

  lastReportRows = {headers, rows, summary, title, year, roles};
  const now = new Date();
  body.innerHTML = `
    <div id="printReportHeader">
      <div class="prh-company">איזון תעשיות ומתכת בע"מ</div>
      <div class="prh-title">${title}${year?(' - '+year):''}</div>
      <div class="prh-meta">הופק בתאריך ${now.toLocaleDateString('he-IL')} בשעה ${now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <h3 class="no-print" style="margin:0 0 14px;font-size:15px;">${title} ${year?('- '+year):''}</h3>
    ${summary.length? `<div class="report-summary-box"><div class="rs-grid">${summary.map(s=>`<div class="rs-item"><div class="rs-label">${s.label}</div><div class="rs-value" style="${s.role==='income'?'color:#6fe3a3;':s.role==='expense'?'color:#ff9d9d;':''}">${s.value}</div></div>`).join('')}</div></div>` : ''}
    ${viewState.reportMonth ? `<div class="no-print" style="margin-bottom:10px;"><button class="btn btn-ghost btn-sm" onclick="viewState.reportMonth=''; renderCurrentView();">↩ חזרה לכל השנה</button></div>` : ''}
    <div class="table-wrap"><table><thead><tr>${headers.map((h,i)=>{const role=roles&&roles[i]; const cls=(role==='income'||role==='expense')?` col-${role}`:''; return `<th class="${cls}">${h}</th>`;}).join('')}</tr></thead>
    <tbody>${rows.length? rows.map((r,i)=>`<tr>${r.map((c,ci)=>{
        const role = roles && roles[ci];
        const cls = (role==='income'||role==='expense') ? ` col-${role}` : '';
        if(ci===0 && rowMonthKeys[i]) return `<td class="${cls}"><a href="javascript:void(0)" class="no-print" onclick="filterReportMonth('${rowMonthKeys[i]}')" style="color:var(--blue);text-decoration:underline;cursor:pointer;">${c}</a><span class="print-only" style="display:none;">${c}</span></td>`;
        return `<td class="${cls}">${c}</td>`;
      }).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}"><div class="empty-state"><div class="ic">📭</div>אין נתונים להצגה בדוח זה</div></td></tr>`}</tbody>
    </table></div>`;
}

function downloadReportPDF(){
  showToast('נפתח חלון הדפסה - בחרו "שמירה כ-PDF" ביעד ההדפסה כדי להוריד את הדוח');
  setTimeout(()=> window.print(), 300);
}

function exportReportStyledExcel(){
  const {headers, rows, title, year, summary, roles} = lastReportRows;
  const now = new Date();
  const dateStr = now.toLocaleDateString('he-IL');
  const timeStr = now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

  const summaryHtml = (summary && summary.length) ? `
    <table style="border-collapse:collapse;width:100%;margin-bottom:14px;" dir="rtl">
      <tr>${summary.map(s=>`<td style="background:#134a72;color:#ffffff;font-weight:bold;font-size:11px;padding:8px;border:1px solid #0e3a5f;text-align:center;">${escXls(s.label)}</td>`).join('')}</tr>
      <tr>${summary.map(s=>`<td style="background:#eef2f7;color:${s.role==='income'?'#1f7a4d':s.role==='expense'?'#b7322a':'#0e3a5f'};font-weight:bold;font-size:14px;padding:10px;border:1px solid #ccd7e0;text-align:center;">${escXls(s.value)}</td>`).join('')}</tr>
    </table>` : '';

  const headerRow = `<tr>${headers.map((h,i)=>{
    const role = roles && roles[i];
    const bg = role==='income' ? '#1f7a4d' : role==='expense' ? '#b7322a' : '#0e3a5f';
    return `<th style="background:${bg};color:#ffffff;font-weight:bold;padding:9px 10px;border:1px solid #333;font-size:12px;">${escXls(h)}</th>`;
  }).join('')}</tr>`;

  const bodyRows = rows.map((r,ri)=>{
    const rowBg = ri%2===0 ? '#ffffff' : '#f3f6f9';
    return `<tr>${r.map((c,ci)=>{
      const role = roles && roles[ci];
      const color = role==='income' ? '#1f7a4d' : role==='expense' ? '#b7322a' : '#222222';
      const weight = (role==='income'||role==='expense') ? 'bold' : 'normal';
      return `<td style="background:${rowBg};color:${color};font-weight:${weight};padding:7px 10px;border:1px solid #ddd;text-align:center;font-size:11.5px;">${escXls(c)}</td>`;
    }).join('')}</tr>`;
  }).join('');

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="UTF-8">
  <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
  <x:Name>${escXls(title)}</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>
  </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
  </head>
  <body style="font-family:Arial,sans-serif;direction:rtl;" dir="rtl">
    <table style="border-collapse:collapse;width:100%;margin-bottom:6px;" dir="rtl">
      <tr><td style="background:#0e3a5f;color:#ffffff;font-size:18px;font-weight:bold;padding:14px;text-align:center;" colspan="${headers.length}">איזון תעשיות ומתכת בע"מ — ${escXls(title)}${year?(' '+year):''}</td></tr>
      <tr><td style="background:#eef2f7;color:#0e3a5f;font-size:11px;padding:6px;text-align:center;" colspan="${headers.length}">הופק בתאריך ${dateStr} בשעה ${timeStr}</td></tr>
    </table>
    ${summaryHtml}
    <table style="border-collapse:collapse;width:100%;" dir="rtl">
      ${headerRow}
      ${bodyRows || `<tr><td colspan="${headers.length}" style="padding:14px;text-align:center;color:#888;">אין נתונים להצגה בדוח זה</td></tr>`}
    </table>
  </body></html>`;

  const blob = new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (title||'report')+'.xls';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('קובץ האקסל המעוצב יוצא בהצלחה');
}
function escXls(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportReportCSV(){
  const {headers, rows, title, summary} = lastReportRows;
  let csv = '\uFEFF'+headers.join(',')+'\n';
  rows.forEach(r=> csv += r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')+'\n');
  if(summary && summary.length){
    csv += '\n"סיכום"\n';
    summary.forEach(s=> csv += `"${String(s.label).replace(/"/g,'""')}","${String(s.value).replace(/"/g,'""')}"\n`);
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (title||'report')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('הקובץ יוצא בהצלחה');
}

function dismissAlert(key){ DB.dismissedAlerts.push(key); saveDB(); renderCurrentView(); renderSidenav(); }
function dismissAllAlerts(){ computeAlerts().forEach(a=>DB.dismissedAlerts.push(a.key)); saveDB(); renderCurrentView(); renderSidenav(); showToast('כל ההתראות סומנו כטופלו'); }

}
function addSupplier(){
  const name = document.getElementById('newSupplierName').value.trim();
  if(!name) return;
  if(!DB.suppliers.find(s=>s.name===name)) DB.suppliers.push({id:uid('sup'), name});
  saveDB(); showToast('הנתונים נשמרו בהצלחה'); renderCurrentView();
}

    <div class="field" style="max-width:320px;">
      <select id="currentUserSelect" onchange="setCurrentUser(this.value)">

function permanentDelete(rbId){
  confirmDialog('פעולה זו תמחק את הרשומה לצמיתות ולא ניתן יהיה לשחזר אותה. להמשיך?', ()=>{
    DB.recycleBin = DB.recycleBin.filter(r=>r.id!==rbId);

  });
}
/* =========================================================================
   אתחול המערכת
   ========================================================================= */
(async function init(){
  window.addEventListener('error', function(e){
    try{
      const root = document.getElementById('toast-root');
      const t = document.createElement('div');
      t.className = 'toast err';
      t.style.maxWidth = '90vw';
      t.innerHTML = `<span>⚠️</span><span>שגיאה במערכת: ${(e.message||'').toString().slice(0,200)} (שורה ${e.lineno||'-'})</span>`;
      root.innerHTML=''; root.appendChild(t);
      setTimeout(()=>{ t.remove(); }, 8000);
    }catch(_){}
  });
  await loadDB();
  ensureDefaultCreditCardExpense();
  navigateTo('dashboard');
  updateCloudStatusUI();

  // autosave safety net every 20s in case of any missed save call
  setInterval(()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){} }, 20000);

  // silent periodic pull from the cloud, so changes made on another computer show up here too
  // without requiring a manual refresh - re-renders the current view if new data arrived
  setInterval(async ()=>{
    if(!supabaseClient) return;
    // never blow away an in-progress, unsaved form - skip this refresh entirely
    // while the user is actively composing a new invoice/expense. The next
    // successful poll after they leave this screen will pick up any missed changes.
    if(currentView==='income-entry' || currentView==='expense-entry') return;
    try{
      const before = JSON.stringify(DB);
      await loadDB();
      updateCloudStatusUI();
      if(JSON.stringify(DB) !== before){
        renderSidenav();
        renderCurrentView();
      }
    }catch(e){ /* stay quiet - this is a background convenience sync, not user-initiated */ }
  }, 45000);
})();
